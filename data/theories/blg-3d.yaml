id: blg-3d
name: '3d BLG theory, $SU(2)_k \times SU(2)_{-k}$'
aliases:
  - 'BLG theory, $SU(2)_k \times SU(2)_{-k}$'
  - Bagger–Lambert–Gustavsson theory
  - 'Bagger–Lambert $\mathcal{A}_4$ theory'
  - '$\mathcal{N}=8$ $SO(4)$ Chern–Simons-matter theory'
d: 3
summary: >-
  $\mathcal{N}=8$ Chern–Simons-matter SCFTs with gauge group $SU(2)\times SU(2)$ (or its
  $\mathbb{Z}_2$ quotient) at levels $(k,-k)$, for every integer $k$. For $k \le 4$ they
  are dual to ABJ(M) theories or their interacting sectors.
tags: [CFT, SCFT, interacting, unitary, gauge theory, supersymmetric, Lagrangian, family]

description: |
  Bagger and Lambert [@bagger2007; @bagger2008a; @bagger2008b], and Gustavsson [@gustavsson2009], constructed a theory of eight scalars
  and their fermionic partners, valued in an algebra with a totally antisymmetric triple
  product (a 3-algebra) and coupled to a non-dynamical gauge field, as a candidate
  worldvolume theory of several M2-branes. It has 16 supercharges, conformal invariance and
  an $SO(8)$ R-symmetry acting on the eight transverse scalars, and the Chern–Simons
  coefficient is quantized. For the explicit example, the $\mathcal{A}_4$ 3-algebra with
  gauge group $SO(4)$, Van Raamsdonk [@vanraamsdonk2008] rewrote the theory as an ordinary
  $SU(2)\times SU(2)$ Chern–Simons theory with bifundamental matter, which clarifies its
  parity invariance. In $\mathcal{N}=2$ language it is the ABJM quiver with
  $SU(2)$ gauge factors: ABJM [@abjm2008] noted that their construction with gauge group
  $SU(2)\times SU(2)$ has extra symmetry and coincides with the Bagger–Lambert theory.

  There are two global forms, $SU(2)_k\times SU(2)_{-k}$ and
  $(SU(2)_k\times SU(2)_{-k})/\mathbb{Z}_2$. Both have manifest $\mathcal{N}=8$
  supersymmetry for every integer $k$, and they have the same stress-tensor four-point
  function, so the $c_T$ values below apply to both [@agmon2018, fn. 4]. As
  $k \to \infty$ the theory becomes weakly coupled and $c_T \to 64$, the value for its
  free field content.

  Lambert and Tong [@lambert2008] argued that the theory describes two membranes in the orbifold
  $\mathbb{R}^8/\mathbb{Z}_2$; at $k = 1$ and $k = 2$ its classical moduli space coincides
  with the infrared moduli space of $SO(4)$ and $SO(5)$ super Yang–Mills theory. Distler, Mukhi, Papageorgakis and Van Raamsdonk [@distler2008] argued that the moduli space at
  level $k$ is $(\mathbb{R}^8\times\mathbb{R}^8)/D_{2k}$, with $D_{2k}$ the dihedral group of
  order $4k$, and conjectured that the theory describes two M2-branes on a
  $\mathbb{Z}_{2k}$ "M-fold". For general $k$ no M-theory interpretation is known.

  ### Dualities with ABJ(M) theories
  In the notation $\mathrm{BLG}_k = (SU(2)_k\times SU(2)_{-k})/\mathbb{Z}_2$ and
  $\mathrm{BLG}'_k = SU(2)_k\times SU(2)_{-k}$, the dualities listed by Agmon, Chester and
  Pufu [@agmon2018b, Eqs. (2)–(3)] are:
  - $\mathrm{BLG}_1$ $\cong$ $U(2)_1\times U(2)_{-1}$ ABJM, two M2-branes in flat space;
  - $\mathrm{BLG}'_2$ $\cong$ $U(2)_2\times U(2)_{-2}$ ABJM;
  - $\mathrm{BLG}_3$ $\otimes$ (free $\mathcal{N}=8$ theory) $\cong$ $U(3)_1\times U(3)_{-1}$ ABJM, so
    $\mathrm{BLG}_3$ is the interacting sector of three M2-branes in flat space;
  - $\mathrm{BLG}_4$ $\cong$ $U(2)_2\times U(3)_{-2}$ ABJ.

  Lambert and Papageorgakis [@lambert2010] derived the first by integrating out the $U(1)$ gauge field of
  ABJM, and conjectured the second. Bashkirov and Kapustin [@bashkirov2011b] tested such dualities by
  comparing superconformal indices. Agmon, Chester and Pufu [@agmon2018b] proposed the third and
  supported it by matching moduli spaces, superconformal indices, $S^3$ partition functions
  and BPS OPE coefficients. They also computed [@agmon2018, Secs. 3.3.1, 4] the BPS OPE coefficients of $\mathrm{BLG}_k$ for all
  $k$ and found that, unlike some ABJ(M) theories, these generically do not saturate the
  numerical bootstrap bounds.

lagrangian: '\mathcal{L} = \frac{k}{4\pi}\,\mathrm{Tr}\Big(A\wedge dA + \tfrac{2}{3}A^3 - \hat A\wedge d\hat A - \tfrac{2}{3}\hat A^3\Big) + \text{(bifundamental matter, as in ABJM)}, \quad A, \hat A \in \mathfrak{su}(2)'

parameters:
  - symbol: 'k'
    description: Chern–Simons level.
    range: 'positive integer'

family:
  parameter: k
  members:
    - at: 1
      label: '$\cong U(2)_1\times U(2)_{-1}$ ABJM'
      note: 'For the $(SU(2)\times SU(2))/\mathbb{Z}_2$ form; two M2-branes in flat space, including the free centre-of-mass sector.'
    - at: 2
      label: '$\cong U(2)_2\times U(2)_{-2}$ ABJM'
      note: 'For the $SU(2)\times SU(2)$ form.'
    - at: 3
      label: 'Interacting sector of $U(3)_1\times U(3)_{-1}$ ABJM'
      note: 'For the $(SU(2)\times SU(2))/\mathbb{Z}_2$ form [@agmon2018b].'
    - at: 4
      label: '$\cong U(2)_2\times U(3)_{-2}$ ABJ'
      note: 'For the $(SU(2)\times SU(2))/\mathbb{Z}_2$ form.'
    - at: 'k \geq 5'
      label: Generic member
      note: 'No known M-theory interpretation; weakly coupled as $k \to \infty$.'

symmetry:
  spacetime: '3d $\mathcal{N}=8$ superconformal group (16 $Q$ + 16 $S$ supercharges), with parity combined with exchange of the two gauge groups'
  euclidean: '$O(4,1)$ (bosonic conformal part)'
  lorentzian: '$OSp(8|4)$'
  supercharges: 16
  global: '$SO(8)_R$; parity'
  parity: true
  global_group:
    - {id: SO(8)_R, group: SO(8), tex: 'SO(8)_R', note: 'Irreps named in the triality frame where the supercharges are in $\mathbf{8}_v$.'}
  gauge: '$SU(2)_k\times SU(2)_{-k}$ or $(SU(2)_k\times SU(2)_{-k})/\mathbb{Z}_2$'
  notes: 'Supersymmetry is manifest in the Lagrangian for every $k$, unlike for ABJM at $k = 1, 2$. Multiplet names follow Dolan [@dolan2008] as used by Chester, Lee, Pufu and Yacoby [@clpy2014, Table 2]: $(B,+)$ half-BPS (the stress-tensor multiplet, in $[0020] = \mathbf{35}_c$), $(B,n)$ and $(A,n)$ short and semi-short, $(A,0)$ long. The notation of Cordova, Dumitrescu and Intriligator [@cordova2016, Sec. 2.1.7] is shown on hover: $X[j]^{(R)}_\Delta$, with $j$ twice the spin and $R$ the $\mathfrak{so}(8)_R$ Dynkin labels in the triality frame where $Q$ is in $\mathbf{8}_v = (1,0,0,0)$, with $\mathbf{8}_c = (0,0,0,1)$, so that the $\mathbf{35}_c$ stress-tensor multiplet is $B_1[0]^{(0,0,0,2)}_1$ [@cordova2016, Eq. (5.74)].'

quantities:
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor coefficient $c_T$ for all $k$, relative to one free real scalar (equivalently one free Majorana fermion)'
    value: '32\left(2 - \frac{I_{4,k}}{I_{2,k}}\right), \quad I_{n,k} = \int_{-\infty}^{\infty} dx\, \frac{x\,\tanh^n(\pi x)}{\sinh(\pi k x)}'
    method: LOC
    refs: [agmon2018]
    note: '[@agmon2018, Eqs. (34)–(35)]. In this normalization the free $\mathcal{N}=8$ theory of eight real scalars and eight Majorana fermions has $c_T = 16$.'
  - symbol: 'C_T/C_T^{\rm free}'
    description: '$k = 1$, relative to one free real scalar'
    value: '\frac{112}{3}'
    method: LOC
    refs: [agmon2018, chester2014]
    note: 'Agmon et al. [@agmon2018, Table 4] give $16/c_T = \frac{3}{7}$; equal to $c_T$ of $U(2)_1\times U(2)_{-1}$ ABJM [@chester2014].'
  - symbol: 'C_T/C_T^{\rm free}'
    description: '$k = 2$, relative to one free real scalar'
    value: '\frac{128}{3}'
    method: LOC
    refs: [agmon2018, chester2014]
    note: 'Agmon et al. [@agmon2018, Table 4] give $16/c_T = \frac{3}{8}$; equal to $c_T$ of $U(2)_2\times U(2)_{-2}$ ABJM [@chester2014].'
  - symbol: 'C_T/C_T^{\rm free}'
    description: '$k = 3$, relative to one free real scalar'
    value: '16\,\frac{31 - 10\pi}{3 - \pi} \approx 46.9998'
    method: LOC
    refs: [chester2014]
  - symbol: 'C_T/C_T^{\rm free}'
    description: '$k = 4$, relative to one free real scalar'
    value: '50.3575'
    method: LOC
    refs: [chester2014]
    note: '[@chester2014, Table 9]; $k = 5$: $52.9354$.'

operators:
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    parity: even
    global: {SO(8)_R: singlet}
    multiplet: {name: stress tensor, component: 'Q^4', type: '$(B,+)$', cdi: '$B_1[0]^{(0,0,0,2)}_1$'}
    method: exact
    note: Stress tensor (conserved).
  - name: 'J_\mu^R'
    Delta: 2
    spin: 1
    parity: even
    global: {SO(8)_R: 28}
    multiplet: {name: stress tensor, component: 'Q^2', type: '$(B,+)$', cdi: '$B_1[0]^{(0,0,0,2)}_1$'}
    method: exact
    note: Conserved R-symmetry currents.
  - name: '\mathcal{O}_{\mathbf{35}_c}'
    Delta: 1
    spin: 0
    parity: even
    global: {SO(8)_R: 35c}
    multiplet: {name: stress tensor, component: primary, type: '$(B,+)$', cdi: '$B_1[0]^{(0,0,0,2)}_1$'}
    method: exact
    refs: [chester2014]
    note: 'Superconformal primary of the half-BPS $\mathcal{N}=8$ stress-tensor multiplet; protected.'

relations:
  - type: related_to
    target: abjm-3d
    note: '$\mathrm{BLG}_1$ $\cong$ $U(2)_1\times U(2)_{-1}$ ABJM; $SU(2)_2\times SU(2)_{-2}$ $\cong$ $U(2)_2\times U(2)_{-2}$ ABJM; $\mathrm{BLG}_3$ $\otimes$ free $\cong$ $U(3)_1\times U(3)_{-1}$ ABJM; $\mathrm{BLG}_4$ $\cong$ $U(2)_2\times U(3)_{-2}$ ABJ, where $\mathrm{BLG}_k$ denotes the $(SU(2)_k\times SU(2)_{-k})/\mathbb{Z}_2$ form. Both families come from the same $\mathcal{N}=2$ quiver.'

