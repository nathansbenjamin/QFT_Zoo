id: usp-5d
name: '5d $USp(2N)$ SCFTs with an antisymmetric hypermultiplet'
aliases:
  - 'Rank-$N$ Seiberg $E_{N_f+1}$ theories'
  - 'Brandhuber–Oz theories'
  - 'D4–D8–O8 SCFTs'
  - '5d SCFTs dual to massive IIA on AdS$_6$'
d: 5
summary: >-
  The UV fixed points of 5d $USp(2N)$ gauge theory with one antisymmetric and $N_f\le7$
  fundamental hypermultiplets, on $N$ D4-branes near an O8-plane with $N_f$ D8-branes. Flavor
  symmetry $E_{N_f+1}\times SU(2)$; at large $N$ they are dual to massive type IIA on a warped
  AdS$_6$ background.
tags: [CFT, SCFT, interacting, unitary, supersymmetric, non-Lagrangian, holographic, large N, family]

description: |
  The rank-$N$ generalization of the Seiberg $E_n$ theories. $N$ D4-branes probe an O8-plane
  with $N_f$ coincident D8-branes in type I$'$ string theory. At finite coupling their
  world-volume theory is 5d $\mathcal{N}=1$ $USp(2N)$ gauge theory with $N_f$ fundamental
  hypermultiplets and one hypermultiplet in the antisymmetric representation. For $N_f\le7$ the
  infinite-coupling limit is expected to be an interacting SCFT [@intriligator1997]. Its flavor symmetry $E_{N_f+1}\times SU(2)$ is enhanced from the
  $SO(2N_f)\times U(1)_I\times SU(2)$ of the gauge theory, where $U(1)_I$ counts instantons and
  $SU(2)$ acts on the antisymmetric hypermultiplet. The Higgs branch is expected to be the moduli
  space of $N$ $E_{N_f+1}$ instantons. At $N_f=0$ there are two fixed points, analogues of $E_1$
  and $\tilde E_1$, labeled by the discrete theta angle of $USp(2N)$, and an analogue of $E_0$.
  At $N=1$ the antisymmetric representation of $USp(2)=SU(2)$ is trivial, the antisymmetric
  hypermultiplet is free and decoupled, and the extra $SU(2)$ acts only on it.

  Brandhuber and Oz [@brandhuber1999] found the dual background as the near-horizon limit of the D4–D8 system in
  massive type IIA supergravity: a warped product of AdS$_6$ with a hemisphere of $S^4$. Its
  boundary, at the O8-plane, has the form AdS$_6\times S^3$; there the dilaton diverges and the
  $E_{N_f+1}$ gauge fields live. The $SO(4) = SU(2)\times SU(2)$ isometry is the $SU(2)_R$
  R-symmetry times the $SU(2)$ flavor symmetry, and the superalgebra is $F(4)$. Supergravity is
  reliable at large $N$ away from the boundary, and its action scales as $N^{5/2}$.

  Jafferis and Pufu [@jafferis2012] evaluated the $S^5$ partition function of the gauge theory at large $N$ by
  supersymmetric localization. They argue that instanton contributions are exponentially
  suppressed there, and they reproduce the $N^{5/2}$ scaling. The free energy agrees with a
  holographic computation of the entanglement entropy in the dual. Chang, Fluder, Lin and Wang [@chang2018]
  extracted $C_T$ from the squashed-sphere partition function and matched it to Romans $F(4)$
  gauged supergravity.

parameters:
  - symbol: 'N'
    description: 'Rank: gauge group $USp(2N)$, number of D4-branes.'
    range: '$N \geq 1$'
  - symbol: 'N_f'
    description: Number of fundamental hypermultiplets (D8-branes at the O8-plane).
    range: '$0 \le N_f \le 7$'

family:
  parameter: N_f
  members:
    - at: 7
      label: 'Flavor $E_8\times SU(2)$'
    - at: 6
      label: 'Flavor $E_7\times SU(2)$'
    - at: 5
      label: 'Flavor $E_6\times SU(2)$'
    - at: 4
      label: 'Flavor $Spin(10)\times SU(2)$'
    - at: 3
      label: 'Flavor $SU(5)\times SU(2)$'
    - at: 2
      label: 'Flavor $SU(3)\times SU(2)\times SU(2)$'
    - at: 1
      label: 'Flavor $SU(2)\times U(1)\times SU(2)$'
    - at: 0
      label: 'Flavor $SU(2)\times SU(2)$ or $U(1)\times SU(2)$'
      note: 'Two fixed points, analogues of $E_1$ and $\tilde E_1$ (theta angle $0$ or $\pi$).'

symmetry:
  spacetime: '5d $\mathcal{N}=1$ superconformal group (8 $Q$ + 8 $S$ supercharges); parity not recorded'
  euclidean: '$SO(6,1)$ (bosonic conformal part)'
  lorentzian: '$F(4)$'
  supercharges: 8
  global: 'Flavor $E_{N_f+1}\times SU(2)$ (the $SU(2)$ acts on the antisymmetric hypermultiplet and is absent at $N=1$); R-symmetry $SU(2)_R$'
  parity: false
  global_group:
    - {id: SU(2)_R, group: SU(2), tex: 'SU(2)_R'}
    - {id: E, group: 'Lie(E_{N_f+1})'}
    - {id: SU(2), group: SU(2), note: 'Acts on the antisymmetric hypermultiplet; absent at $N = 1$.'}
  gauge: '$USp(2N)$ (infrared gauge theory description)'
  notes: 'Multiplet names follow Chang, Fluder, Lin and Wang [@chang2017, Sec. 5.1]: $\mathcal{D}[2]$ flavor current, $\mathcal{B}[0]_0$ stress tensor, $\mathcal{L}[0]_{\Delta,\ell}$ long, with $[R]$ the $SU(2)_R$ Dynkin label. The label of Cordova, Dumitrescu and Intriligator [@cdi2016] is shown on hover.'

quantities:
  - symbol: 'F'
    description: '$S^5$ free energy, $F = -\log|Z_{S^5}|$ (so $-F > 0$), leading order at large $N$'
    value: '-\frac{9\sqrt{2}\,\pi N^{5/2}}{5\sqrt{8-N_f}}'
    method: LOC, large N, matrix model
    refs: [jafferis2012]
    note: 'Jafferis–Pufu [@jafferis2012, Eq. (3.6)]; [@jafferis2012, Eq. (1.1)] at $n=1$ states the correction as $o(N^{5/2})$, and Chang et al. [@chang2018, Eq. (3.18)] as $O(N^{3/2})$. In the convention $\tilde F = \log|Z_{S^5}|$, $\tilde F = -F$.'
  - symbol: 'C_T'
    description: 'Stress-tensor two-point coefficient, leading order at large $N$, normalized so that a free hypermultiplet has $C_T = 15$'
    value: '\frac{1152\sqrt{2}\,N^{5/2}}{\pi\sqrt{8-N_f}}'
    method: LOC, large N, squashed sphere
    refs: [chang2018, chang2017]
    note: 'Chang et al. [@chang2018, Eq. (3.19)], with corrections $O(N^{3/2})$. It uses the relation between $C_T$ and the squashed-sphere free energy of Chang et al. [@chang2017], in which a free real scalar has $C_T = 5/4$.'

operators:
  - name: 'J_\mu'
    Delta: 4
    spin: 1
    global: {SU(2)_R: singlet, E: [singlet, adjoint], SU(2): [singlet, adjoint]}
    multiplet: {name: flavor current, component: 'Q^2', type: '$\mathcal{D}[2]$', cdi: '$C_1[0,0]^{(2)}_3$'}
    method: exact
    note: Conserved flavor currents.
  - name: 'T_{\mu\nu}'
    Delta: 5
    spin: 2
    global: {SU(2)_R: singlet, E: singlet, SU(2): singlet}
    multiplet: {name: stress tensor, component: 'Q^4', type: '$\mathcal{B}[0]_0$', cdi: '$B_2[0,0]^{(0)}_3$'}
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: related_to
    target: seiberg-en-5d
    note: 'At $N=1$ the antisymmetric hypermultiplet decouples, and the interacting part is the rank-1 Seiberg theory: $E_{N_f+1}$ for $N_f\ge1$; $E_1$ or $\tilde E_1$ for $N_f=0$.'

