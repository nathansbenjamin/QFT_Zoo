relations:
  - type: related_to
    target: n4-sym
    note: 'Both are $\mathcal{N}=2$ conformal gauge theories with an exactly marginal coupling ($\mathcal{N}=4$ SYM is $SU(N)$ with one adjoint hypermultiplet). For gauge group $SU(2)$ they share the $D_4$ scale-invariant Seiberg–Witten curve: $\mathcal{N}=4$ SYM is the submaximal mass deformation with $\mathfrak{su}(2) \subset \mathfrak{so}(8)$ flavor symmetry [@beem2014].'

