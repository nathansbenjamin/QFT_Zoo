id: n2-sqcd-4d
name: '$\mathcal{N}=2$ superconformal QCD'
aliases:
  - '$\mathcal{N}=2$ SCQCD'
  - '$\mathcal{N}=2$ $SU(N)$ gauge theory with $N_f = 2N$ fundamental hypermultiplets'
  - 'Conformal $\mathcal{N}=2$ SQCD'
d: 4
summary: >-
  The $\mathcal{N}=2$ $SU(N)$ gauge theory with $N_f = 2N$ fundamental hypermultiplets, whose
  gauge coupling is exactly marginal. For $SU(2)$ the flavor symmetry is $SO(8)$, and the
  $SL(2,\mathbb{Z})$ duality group acts on it by triality.
tags: [CFT, SCFT, interacting, unitary, gauge theory, supersymmetric, Lagrangian, family]

description: |
  An $\mathcal{N}=2$ $SU(N)$ vector multiplet (gauge field, two Weyl gauginos and a complex
  adjoint scalar $\phi$) coupled to $N_f = 2N$ hypermultiplets in the fundamental
  representation. With $N_f = 2N$ the one-loop beta function vanishes, and with $\mathcal{N}=2$
  supersymmetry this suffices for conformal invariance of the quantum theory. The complexified
  coupling $\tau$ is exactly marginal: the dimension-four operator it multiplies is the top
  component of the multiplet whose primary is $\mathrm{Tr}\,\phi^2$. The anomalies $a$ and $c$
  do not depend on $\tau$ and follow from counting free fields, $n_v = N^2-1$ vector multiplets
  and $n_h = 2N^2$ hypermultiplets. The Coulomb branch is parametrized by
  $u_k = \langle\mathrm{Tr}\,\phi^k\rangle$, $k = 2,\dots,N$.

  For $N = 2$ the fundamental representation is pseudoreal, so the flavor symmetry is $SO(8)$
  and the four hypermultiplets form its vector $\mathbf{8}_v$. Seiberg and Witten [@seiberg1994] solved the
  theory and found that its $SL(2,\mathbb{Z})$ duality is combined with $SO(8)$ triality. The
  elementary quarks, with magnetic and electric charges $(n_m, n_e) = (0,1)$, form the
  $\mathbf{8}_v$, while the states with $(1,0)$ and $(1,1)$ form the $\mathbf{8}_s$ and the
  $\mathbf{8}_c$, and duality permutes these three representations. The Higgs branch is the
  one-instanton moduli space of $SO(8)$, and
  $c$ and $k_{SO(8)}$ saturate the unitarity bounds that follow from the associated chiral
  algebra, which Beem et al. [@beem2013] conjecture to be the $\mathfrak{so}(8)$ affine algebra at level
  $-2$. This theory is the $D_4$ member of the rank-one series that also contains the
  Argyres–Douglas theories $H_0, H_1, H_2$ and the Minahan–Nemeschansky theories.

  For $N \geq 3$ the flavor symmetry is $U(2N) = SU(2N)\times U(1)$ and the S-duality group is
  only the subgroup $\Gamma_0(2)$ of $SL(2,\mathbb{Z})$, so the space of couplings has a second,
  "very strongly coupled" cusp [@gaiotto2009]. For $N = 3$ Argyres and Seiberg [@argyres2007] identified the theory
  at this cusp: an $SU(2)$ gauge theory with one fundamental hypermultiplet, coupled to the
  rank-one $E_6$ Minahan–Nemeschansky theory by gauging the $SU(2)$ in
  $SU(2)\times SU(6) \subset E_6$.

  Coupling an adjoint chiral multiplet $M$ of the flavor symmetry through
  $W = \mathrm{Tr}\,M\mu$ and giving $M$ a principal nilpotent expectation value breaks
  $\mathcal{N}=2$ to $\mathcal{N}=1$. Maruyoshi and Song [@maruyoshi2016] found that these deformations flow to
  Argyres–Douglas theories with enhanced $\mathcal{N}=2$ supersymmetry: $SU(N)$ with $2N$
  flavors flows to the $(A_1, A_{2N-1})$ theory, and $SU(2)$ with the whole $SO(8)$ broken flows
  to the minimal Argyres–Douglas theory $H_0$ (plus free chiral multiplets).

parameters:
  - symbol: 'N'
    description: Rank of the gauge group $SU(N)$; there are $N_f = 2N$ fundamental hypermultiplets.
    range: '$N \geq 2$'
  - symbol: '\tau'
    description: Complexified gauge coupling (exactly marginal).
    range: 'upper half-plane, modulo $SL(2,\mathbb{Z})$ for $N=2$ (with $\tau = \theta/\pi + 8\pi i/g^2$) and modulo $\Gamma_0(2)$ for $N\geq3$'

family:
  parameter: N
  members:
    - at: 2
      label: '$SU(2)$, $N_f = 4$'
      note: '$SO(8)$ flavor symmetry with $k_{SO(8)} = 4$; $a = \tfrac{23}{24}$, $c = \tfrac{7}{6}$. $SL(2,\mathbb{Z})$ duality acts on $SO(8)$ by triality.'
    - at: 3
      label: '$SU(3)$, $N_f = 6$'
      note: 'At infinite coupling, dual to $SU(2)$ with one fundamental hypermultiplet coupled to the $E_6$ Minahan–Nemeschansky theory [@argyres2007].'
    - at: 'N \geq 4'
      note: 'Flavor symmetry $U(2N)$, $k_{SU(2N)} = 2N$; Coulomb-branch operators $\mathrm{Tr}\,\phi^k$, $k = 2,\dots,N$.'

symmetry:
  spacetime: '4d $\mathcal{N}=2$ superconformal group (8 $Q$ + 8 $S$ supercharges), with parity at $\theta \in \{0, \pi\}$ (parity maps $\theta \to -\theta$)'
  euclidean: '$O(5,1)$ (bosonic conformal part)'
  lorentzian: '$SU(2,2|2)$'
  supercharges: 8
  global: '$U(2N) = SU(2N)\times U(1)$ flavor symmetry for $N\geq3$, enhanced to $SO(8)$ for $N=2$; R-symmetry $SU(2)_R\times U(1)_r$'
  parity: conditional
  global_group:
    - {id: SU(2)_R, group: SU(2), tex: 'SU(2)_R'}
    - {id: U(1)_r, group: U(1), tex: 'U(1)_r', note: 'Normalized as in Dolan–Osborn: a Coulomb-branch chiral primary, in an $\mathcal{E}_{r(0,0)}$ multiplet, has $r = \Delta$.'}
    - {id: G_F, group: 'Lie(U(2N))', tex: 'G_F', note: 'Flavor symmetry $U(2N) = SU(2N)\times U(1)$ for $N \geq 3$, enhanced to $SO(8)$ for $N = 2$.'}
  gauge: '$SU(N)$'
  notes: 'Flavor central charges $k$ are normalized so that gauging a group $G$ is conformal when the matter it couples to has $k_G = 4h^\vee(G)$; a fundamental hypermultiplet of $SU(N)$ contributes 2 to $k_{SU(N)}$. Multiplet names follow Dolan and Osborn [@dolan2002] as tabulated by Beem et al. [@beem2013, Table 7]: $\mathcal{E}_{r(0,0)}$ Coulomb-branch chiral, $\hat{\mathcal{B}}_R$ Higgs-branch half-BPS, $\hat{\mathcal{C}}_{0(0,0)}$ stress tensor, $\mathcal{A}^{\Delta}_{R,r(j,\bar\jmath)}$ long. The label of Cordova, Dumitrescu and Intriligator [@cdi2016] is shown on hover; its $u(1)_r$ charge is twice the one here.'

quantities:
  - symbol: 'a'
    description: 'Euler conformal anomaly (normalized so a free real scalar has $a = \tfrac{1}{360}$)'
    value: '\frac{7N^2-5}{24}'
    method: exact, free-field counting; independent of the coupling
    refs: [shapere2008]
    note: 'Shapere and Tachikawa [@shapere2008, Eq. (4.10)], who also rederive it from the Seiberg–Witten curve. It equals $(5n_v + n_h)/24$ with $n_v = N^2-1$, $n_h = 2N^2$, using $a = \tfrac{5}{24}$ per vector multiplet and $\tfrac{1}{24}$ per hypermultiplet [@shapere2008, Eqs. (2.5), (2.6)]. $SU(2)$: $\tfrac{23}{24}$.'
  - symbol: 'c'
    description: 'Weyl conformal anomaly (normalized so a free real scalar has $c = \tfrac{1}{120}$)'
    value: '\frac{2N^2-1}{6}'
    method: exact, free-field counting; independent of the coupling
    refs: [shapere2008, beem2013]
    note: '[@shapere2008, Eq. (4.10)]; $(2n_v + n_h)/12$. $SU(2)$: $\tfrac76$ [@beem2013, Eq. (5.2)].'
  - symbol: 'k_{SO(8)}'
    description: '$SO(8)$ flavor central charge for $N=2$'
    value: '4'
    method: exact
    refs: [beem2013, beem2014]
    note: 'Saturates the unitarity bound $k_{SO(8)} \geq 4$ of [@beem2013, Table 3].'
  - symbol: 'k_{SU(2N)}'
    description: '$SU(2N)$ flavor central charge for $N\geq3$'
    value: '2N'
    method: exact
    refs: [beem2013, gimenezgrau2020]
    note: 'The chiral algebra contains $\widehat{\mathfrak{su}}(2N)\times\widehat{\mathfrak{u}}(1)$ at level $k_{2d} = -N = -\tfrac12 k$ [@beem2013, Sec. 5.2].'

operators:
  - name: '\mathrm{Tr}\,\phi^k'
    Delta: 'k'
    spin: 0
    parity: pair
    global: {SU(2)_R: singlet, U(1)_r: unknown, G_F: singlet}
    role: Coulomb-branch generator
    multiplet: {name: '$\mathrm{Tr}\,\phi^k$', component: primary, type: '$\mathcal{E}_{k(0,0)}$', cdi: '$L\bar B_1[0;0]^{(0;2k)}_{k}$'}
    method: exact
    refs: [shapere2008, beem2014]
    note: 'Coulomb-branch chiral ring generators, $k = 2,\dots,N$. The top component of the $k=2$ multiplet is the exactly marginal operator.'
    family:
      id: coulomb-branch
      parameters:
        - {symbol: k, from: 2, to: N}
  - name: '\mu = \tilde Q Q'
    Delta: 2
    spin: 0
    parity: unknown
    global: {SU(2)_R: adjoint, U(1)_r: 0, G_F: adjoint}
    multiplet: {name: flavor current, component: primary, type: '$\hat{\mathcal{B}}_1$', cdi: '$B_1\bar B_1[0;0]^{(2;0)}_2$'}
    method: exact
    refs: [beem2013]
    note: 'Moment map (Higgs-branch operator), the superconformal primary of the flavor-current multiplet.'
  - name: 'J_\mu'
    Delta: 3
    spin: 1
    parity: unknown
    global: {SU(2)_R: singlet, U(1)_r: 0, G_F: adjoint}
    multiplet: {name: flavor current, component: 'Q\bar Q', type: '$\hat{\mathcal{B}}_1$', cdi: '$B_1\bar B_1[0;0]^{(2;0)}_2$'}
    method: exact
    note: Conserved flavor current.
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    parity: even
    global: {SU(2)_R: singlet, U(1)_r: 0, G_F: singlet}
    multiplet: {name: stress tensor, component: 'Q^2\bar Q^2', type: '$\hat{\mathcal{C}}_{0(0,0)}$', cdi: '$A_2\bar A_2[0;0]^{(0;0)}_2$'}
    method: exact
    note: Stress tensor (conserved).

