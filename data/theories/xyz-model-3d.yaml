id: xyz-model-3d
name: '3d $\mathcal{N}=2$ XYZ model'
aliases:
  - '$\mathcal{N}=2$ SQED with one flavour'
  - '$\mathcal{N}=2$ supersymmetric QED$_3$ with $N_f = 1$'
  - 'Wess–Zumino model with $W = XYZ$'
d: 3
summary: >-
  The infrared fixed point of three $\mathcal{N}=2$ chiral superfields with superpotential
  $W = XYZ$. By 3d mirror symmetry it is also the infrared fixed point of $\mathcal{N}=2$
  SQED with one flavour.
tags: [CFT, SCFT, interacting, unitary, Lagrangian, supersymmetric, gauge theory, critical phenomena]

description: |
  Three chiral superfields $X, Y, Z$ with $W = h\,XYZ$. The superpotential is symmetric under
  permutations of the fields, so at the fixed point $R_X = R_Y = R_Z = 2/3$ and the three
  chiral primaries have $\Delta = 2/3$ exactly. The $F$-terms give the chiral-ring relations
  $XY = YZ = ZX = 0$, and the moduli space is three one-dimensional cones meeting at the
  origin.

  Aharony, Hanany, Intriligator, Seiberg and Strassler [@ahiss1997] proposed that $\mathcal{N}=2$ SQED with
  one flavour (a $U(1)$ vector multiplet and chirals $Q$, $\tilde Q$ of charge $\pm1$) flows to
  the same fixed point. The meson $M = \tilde QQ$ parametrizes the Higgs branch and the
  monopole operators $V_\pm$ the two halves of the Coulomb branch; in the dual description
  $W = -MV_+V_-$, so $(M, V_+, V_-)$ play the roles of $(X, Y, Z)$. The axial and topological
  symmetries $U(1)_A\times U(1)_J$ of SQED become the $U(1)\times U(1)$ flavor symmetry, and
  the permutation symmetry, which exchanges the three branches, is not visible in SQED.
  Jafferis [@jafferis2010] showed that extremizing $|Z_{S^3}|$ in SQED gives $R_Q = R_{\tilde Q} = 1/3$, hence
  $\Delta_{\tilde QQ} = 2/3$, and that the SQED and XYZ $S^3$ partition functions agree as
  functions of the trial R-charge.

  The XYZ point lies on a one-complex-dimensional conformal manifold. The three marginal
  chiral operators $X^3, Y^3, Z^3$, modulo the complexified $U(1)\times U(1)$, leave one
  exactly marginal coupling: $W = h_1XYZ + \tfrac{h_2}{6}(X^3+Y^3+Z^3)$ flows to a family of
  SCFTs labelled by $\tau = h_2/h_1$. The duality group is $S_4$ and the manifold is an
  orbifold of $\mathbb{CP}^1$. Besides the XYZ model ($\tau=0$) it contains three decoupled
  copies of the $\mathcal{N}=2$ super-Ising model ($\tau=\infty$). The localization results
  for $F$ and $C_T$ hold at every point. The $4-\epsilon$ expansion and the bootstrap agree
  closely for unprotected dimensions on the manifold, except near the XYZ point, where the
  bootstrap bounds converge slowly; no unprotected XYZ dimension is quoted here.

  The XYZ model has been proposed as the theory of the tricritical point between a Dirac
  semimetal and a nematic pair-density-wave phase on the surface of a topological insulator
  with three Dirac cones [@jian2017].

lagrangian: '\mathcal{L} = \int d^4\theta\,\big(\bar XX + \bar YY + \bar ZZ\big) + \Big(\int d^2\theta\; h\,XYZ + \text{c.c.}\Big)'

symmetry:
  spacetime: '3d $\mathcal{N}=2$ superconformal group (4 $Q$ + 4 $S$ supercharges), with parity'
  euclidean: '$O(4,1)$ (bosonic conformal part)'
  lorentzian: '$OSp(2|4)$'
  supercharges: 4
  global: '$U(1)\times U(1)\rtimes S_3$ flavor symmetry ($S_3$ permutes $X, Y, Z$), and $U(1)_R$'
  parity: true
  global_group:
    - {id: S3, group: S_3, note: 'Permutes $X, Y, Z$. The $U(1)\times U(1)$ flavor symmetry, on which $S_3$ acts by automorphisms, is not declared: the rows here are $S_3$ multiplets whose members carry different $U(1)\times U(1)$ charges.'}
    - {id: U(1)_R, group: U(1), tex: 'U(1)_R'}
  notes: 'In the SQED description the $S_3$ is emergent; only $U(1)_A\times U(1)_J$ is manifest. Multiplets are named descriptively (chiral, antichiral, long), as is standard in 3d $\mathcal{N}=2$; the notation of Cordova, Dumitrescu and Intriligator [@cordova2016, Sec. 2.1.2] is shown on hover: $X\bar Y[j]^{(r)}_\Delta$, with $j$ twice the spin and $r$ the $U(1)_R$ charge; $Q$ has $r = -1$ and $\bar Q$ has $r = +1$, and chiral primaries are $L\bar B_1[0]^{(r)}_r$.'

quantities:
  - key: F
    symbol: 'F'
    description: '$S^3$ free energy, $F = -\log|Z_{S^3}|$'
    value: '-3\,\ell\left(\tfrac13\right) \approx 0.872'
    method: LOC
    refs: [jafferis2010, nishioka2013]
    note: 'Three chiral multiplets of R-charge $2/3$, each contributing $-\ell(1/3)$ with $\ell(z)$ as defined by Jafferis [@jafferis2010]; so $F$ is three times that of the $\mathcal{N}=2$ super-Ising model.'
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient, relative to three free chiral multiplets'
    value: '\frac{16(16\pi - 9\sqrt{3})}{243\pi} \approx 0.7268'
    method: LOC
    refs: [baggio2017]
    note: 'Baggio et al. [@baggio2017] give $C_T = \tfrac{32}{27}\big(16 - \tfrac{9\sqrt3}{\pi}\big) \approx 13.0821$ in units where a free chiral multiplet has $C_T = 6$; divided here by 18. Independent of $\tau$ on the conformal manifold.'
  - symbol: 'C_J/C_J^{\rm free}'
    description: 'Two-point coefficient of either $U(1)$ flavor current (charges $(1,-1,0)$ on $(X,Y,Z)$), relative to one free chiral multiplet of unit charge'
    value: '\frac{16}{9} - \frac{4}{\sqrt{3}\,\pi} \approx 1.043'
    method: LOC
    refs: [baggio2017]
    note: 'The free theory with the same charges (two chirals of charge $\pm1$) has ratio 2.'

operators:
  - name: 'X,\ Y,\ Z'
    Delta: '\frac{2}{3}'
    spin: 0
    parity: unknown
    global: {S3: [trivial, standard], U(1)_R: 2/3}
    multiplet: {name: '$X, Y, Z$', component: primary, type: chiral, cdi: '$L\bar B_1[0]^{(2/3)}_{2/3}$'}
    method: exact
    refs: [baggio2017]
    note: 'In SQED: $X \leftrightarrow \tilde QQ$, $Y, Z \leftrightarrow V_\pm$.'
  - name: 'X\bar X - Y\bar Y,\ \ Y\bar Y - Z\bar Z'
    Delta: 1
    spin: 0
    parity: unknown
    global: {S3: standard, U(1)_R: 0}
    multiplet: {name: flavor current, component: primary, cdi: '$A_2\bar A_2[0]^{(0)}_1$'}
    method: exact
    refs: [baggio2017]
    note: 'Bottom components of the two $U(1)$ flavor-current multiplets.'
  - name: 'J_\mu^{(1)},\ J_\mu^{(2)}'
    Delta: 2
    spin: 1
    parity: unknown
    global: {S3: standard, U(1)_R: 0}
    multiplet: {name: flavor current, component: 'Q\bar Q', cdi: '$A_2\bar A_2[0]^{(0)}_1$'}
    method: exact
    note: Conserved flavor currents.
  - name: 'X^3,\ Y^3,\ Z^3'
    Delta: 2
    spin: 0
    parity: unknown
    global: {S3: [trivial, standard], U(1)_R: 2}
    multiplet: {name: '$X^3, Y^3, Z^3$', component: primary, type: chiral, cdi: '$L\bar B_1[0]^{(2)}_2$'}
    method: exact
    refs: [baggio2017]
    note: 'Their $Q^2$ descendants ($\Delta = 3$) are the marginal deformations; one complex combination is exactly marginal.'
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    parity: even
    global: {S3: trivial, U(1)_R: 0}
    multiplet: {name: stress tensor, component: 'Q\bar Q', cdi: '$A_1\bar A_1[2]^{(0)}_2$'}
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: related_to
    target: n2-super-ising-3d
    note: 'On the same conformal manifold: deforming $W = XYZ$ by $X^3+Y^3+Z^3$ connects the XYZ model to three decoupled copies of the $\mathcal{N}=2$ super-Ising model.'

