    target: n2-sqcd-4d
    note: 'At $N_f = 2N_c$: adding an adjoint chiral multiplet gives $\mathcal{N}=2$ superconformal QCD [@seiberg1995], and a mass for that adjoint flows back to $N_f = 2N_c$ SQCD with an exactly marginal quartic superpotential [@ls1995].'
  - type: related_to
    target: qcd-conformal-window-4d
    note: 'The non-supersymmetric analogue.'

