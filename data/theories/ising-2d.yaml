id: ising-2d
name: 2d Ising CFT
aliases:
  - 'Minimal model $\mathcal{M}(4,3)$'
  - Critical 2d Ising model
d: 2
summary: >-
  The $c=\tfrac12$ unitary minimal model, describing the critical point of the
  2d Ising model. Exactly solvable.
tags: [CFT, interacting, unitary, rational, exactly solvable, minimal model, integrable, critical phenomena]

description: |
  The simplest unitary Virasoro minimal model, $\mathcal{M}(4,3)$, with three
  primary operators $1$, $\sigma$, $\epsilon$ and fusion rules
  $\sigma\times\sigma = 1 + \epsilon$, $\sigma\times\epsilon = \sigma$,
  $\epsilon\times\epsilon = 1$.

  Onsager [@onsager1944] solved the lattice model exactly; Belavin, Polyakov and
  Zamolodchikov [@bpz1984] identified the critical point with this minimal model. The theory is closely
  related to a free Majorana fermion (they differ by a sum over spin structures).

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac12$ — 2d conformal symmetry, with parity'
  supercharges: 0
  global: '$\mathbb{Z}_2$'
  notes: 'Kramers–Wannier duality is a non-invertible symmetry of the critical theory.'

quantities:
  - key: c
    symbol: 'c'
    description: Virasoro central charge
    value: '1/2'
    method: exact
    refs: [bpz1984]
  - key: gap
    symbol: '\Delta_{\rm gap}'
    description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary ($\sigma$)'
    value: '1/8'
    method: exact
    refs: [bpz1984]
  - symbol: '\eta'
    description: Anomalous dimension of the spin field
    relation: '\eta = 2\Delta_\sigma'
    value: '\frac{1}{4}'
    method: exact
    refs: [onsager1944]
  - symbol: '\nu'
    description: Correlation-length exponent
    relation: '\nu = 1/(2-\Delta_\epsilon)'
    value: '1'
    method: exact
    refs: [onsager1944]

three_point_functions:
  - operators: ['\sigma', '\sigma', '\epsilon']
    values:
      - structure: scalar
        symbol: 'C_{\sigma\sigma\epsilon}'
        value: '\frac{1}{2}'
        method: exact
        refs: [bpz1984]

operators:
  - name: '\sigma'
    Delta: '\frac{1}{8}'
    spin: 0
    rep: '$\mathbb{Z}_2$-odd'
    method: exact
    note: '$(h,\bar h) = (\tfrac{1}{16},\tfrac{1}{16})$'
    refs: [bpz1984]
  - name: '\epsilon'
    Delta: 1
    spin: 0
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    note: '$(h,\bar h) = (\tfrac{1}{2},\tfrac{1}{2})$'
    refs: [bpz1984]
  - name: 'T'
    Delta: 2
    spin: 2
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    note: 'Stress tensor, Virasoro descendant of the identity.'

relations:
  - type: member_of
    target: virasoro-minimal-a
    at: 3
  - type: member_of
    target: zk-parafermions
    at: 2
  - type: related_to
    target: ising-3d
    note: 'The Ising critical point in $d=2$ and $d=3$: the $\mathbb{Z}_2$ Wilson–Fisher fixed point continued in dimension.'

references:
  - key: onsager1944
    title: 'Crystal Statistics. I. A Two-Dimensional Model with an Order-Disorder Transition'
    authors: Onsager
    year: 1944
    journal: Phys. Rev. 65, 117
    doi: 10.1103/PhysRev.65.117
  - key: bpz1984
    title: Infinite conformal symmetry in two-dimensional quantum field theory
    authors: Belavin, Polyakov, Zamolodchikov
    year: 1984
    journal: Nucl. Phys. B241, 333
    doi: 10.1016/0550-3213(84)90052-X
  - key: costa2011
    title: Spinning Conformal Correlators
    authors: Costa, Penedones, Poland, Rychkov
    year: 2011
    journal: JHEP 11 (2011) 071
    arxiv: '1107.3554'
    doi: '10.1007/JHEP11(2011)071'
    note: 'The embedding-space notation of the OPE structures: $P_{ij}$, Eq. (2.9); $V_{i,jk}$, $H_{ij}$, Eqs. (4.14)–(4.16). Locators refer to arXiv v3, whose printed page numbers are 1 less than the PDF''s.'

contributors: [nathansbenjamin]
