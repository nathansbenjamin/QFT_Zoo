id: n4-sqed-3d
name: '3d $\mathcal{N}=4$ SQED with $N_f$ flavours'
aliases:
  - '$\mathcal{N}=4$ supersymmetric QED$_3$'
  - '$\mathcal{N}=4$ $U(1)$ gauge theory with $N_f$ hypermultiplets'
  - 'SQED$_{N_f}$'
d: 3
summary: >-
  The infrared fixed points of a 3d $\mathcal{N}=4$ $U(1)$ vector multiplet coupled to $N_f$
  hypermultiplets of charge 1. Mirror to the necklace (affine $A_{N_f-1}$) quiver; $N_f=1$ is a
  free twisted hypermultiplet and $N_f=2$ is the self-mirror $T[SU(2)]$.
tags: [CFT, SCFT, interacting, unitary, gauge theory, supersymmetric, Lagrangian, large N, family]

description: |
  An $\mathcal{N}=4$ $U(1)$ vector multiplet (in $\mathcal{N}=2$ language, a vector multiplet
  and a neutral chiral $\Phi$) coupled to $N_f$ hypermultiplets, i.e. chirals $Q_a$ and
  $\tilde Q^a$ of charge $+1$ and $-1$ with $W = \tilde Q^a\Phi Q_a$. $N_f$ counts
  hypermultiplets: $2N_f$ complex scalars and $2N_f$ two-component Dirac fermions. The gauge
  coupling is relevant, and the theory flows to an SCFT at the origin of the moduli space,
  where the Higgs branch (the centred one-instanton moduli space of $SU(N_f)$) meets the
  Coulomb branch (with an $A_{N_f-1}$ singularity). The $SU(2)_H\times SU(2)_C$ R-symmetry
  fixes $\Delta_Q = \Delta_{\tilde Q} = 1/2$.

  Mirror symmetry [@intriligator1996] identifies the same fixed point with the infrared
  limit of $U(1)^{N_f}/U(1)$ with $N_f$ bifundamental hypermultiplets $Q_i$ of neighbouring
  factors $U(1)_i\times U(1)_{i+1}$ ($i$ mod $N_f$), arranged in a necklace. It exchanges the
  Higgs and Coulomb branches, and masses with Fayet–Iliopoulos parameters. The hidden
  $U(1)^{N_f-1}$ topological symmetry of the necklace quiver becomes the $SU(N_f)$ flavor
  symmetry of SQED.

  The BPS monopole operators $V_\pm$ of magnetic charge $\pm1$ are chiral, with R-charge
  and dimension $N_f/2$ [@borokhov2002; @gaiotto2008]. At $N_f=1$ they have
  $\Delta = 1/2$ and form a free twisted hypermultiplet, which is the content of the basic
  mirror pair. At $N_f=2$ they have $\Delta = 1$ and, together with the topological current,
  enhance the $U(1)_J$ symmetry of the Coulomb branch to $SU(2)$. For $N_f\ge3$ no monopole has
  $\Delta \le 1$ and $U(1)_J$ is not enhanced.

  The $S^3$ partition function localizes to a single integral,
  $Z = 2^{-N_f}\int d\lambda\,\cosh^{-N_f}(\pi\lambda)$, which is elementary.

parameters:
  - symbol: 'N_f'
    description: Number of hypermultiplets of charge 1.
    range: '$N_f \geq 1$'

family:
  parameter: N_f
  members:
    - at: 1
      label: 'Free twisted hypermultiplet'
      note: 'Mirror to a free twisted hypermultiplet; $F = \log 2$.'
    - at: 2
      label: '$T[SU(2)]$ (self-mirror)'
      note: '$SU(2)\times SU(2)$ global symmetry; $F = \log 2\pi$; $C_T/C_T^{\rm free} = \tfrac89 + \tfrac{2}{3\pi^2}$ relative to two free hypermultiplets.'
    - at: 3
      note: '$F = 4\log 2$.'
    - at: '\infty'
      label: 'Large $N_f$'
      note: '$F = N_f\log 2 + \tfrac12\log\frac{\pi N_f}{2} + O(1/N_f)$.'

symmetry:
  spacetime: '3d $\mathcal{N}=4$ superconformal group (8 $Q$ + 8 $S$ supercharges), with parity'
  euclidean: '$O(4,1)$ (bosonic conformal part)'
  lorentzian: '$OSp(4|4)$'
  supercharges: 8
  global: '$SU(N_f)$ acting on the hypermultiplets, times the topological $U(1)_J$, which is enhanced to $SU(2)$ at $N_f=1$ (the free twisted hypermultiplet, whose moment maps are bilinears of the free monopole fields $V_\pm$) and at $N_f=2$; R-symmetry $SU(2)_H\times SU(2)_C$'
  parity: true
  global_group:
    - {id: SU(Nf), group: SU(N_f)}
    - {id: U(1)_J, group: U(1), tex: 'U(1)_J', note: 'Enhanced to $SU(2)$ at $N_f = 1, 2$.'}
    - {id: SU(2)_H, group: SU(2), tex: 'SU(2)_H'}
    - {id: SU(2)_C, group: SU(2), tex: 'SU(2)_C'}
  notes: 'Multiplet names follow Dolan [@dolan2008] as used by Chester, Lee, Pufu and Yacoby [@clpy2014, Table 1]: $(B,+)$ and $(B,-)$ the half-BPS Higgs- and Coulomb-branch multiplets [@bpr2016, Sec. 2.1] (Dolan writes $(2,B,\pm)$), conserved the stress-tensor multiplet. Usage is split; the notation of Cordova, Dumitrescu and Intriligator [@cordova2016, Sec. 2.1.4] is shown on hover: $X[j]^{(R;R'')}_\Delta$, with $j$ twice the spin and $(R;R'')$ the Dynkin labels of $SU(2)_H\times SU(2)_C$ (Higgs-branch moment maps are in $(2;0)$).'
  gauge: '$U(1)$'

quantities:
  - symbol: 'F'
    description: '$S^3$ free energy, $F = -\log|Z_{S^3}|$'
    value: 'N_f\log 2 + \log\frac{\sqrt{\pi}\,\Gamma\left(\frac{N_f+1}{2}\right)}{\Gamma\left(\frac{N_f}{2}\right)}'
    method: LOC
    refs: [klebanov2012]
    note: 'From $Z_{S^3} = \frac{2^{-N_f}\,\Gamma(N_f/2)}{\sqrt{\pi}\,\Gamma\left(\frac{N_f+1}{2}\right)}$. It gives $\log 2$ at $N_f=1$, the value for a free hypermultiplet.'
  - symbol: 'F'
    description: 'Large-$N_f$ expansion of the free energy (asymptotic)'
    value: 'N_f\log 2 + \frac12\log\frac{\pi N_f}{2} - \frac{1}{4N_f} + \frac{1}{24N_f^3} + \dots'
    method: 1/Nf, expansion of the exact result
    refs: [klebanov2012]
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient, relative to $N_f$ free hypermultiplets'
    value: '\frac{2N_f^2\,\psi^{(1)}\!\left(\frac{N_f}{2}+1\right) + (\pi^2N_f + 4)N_f + 4}{\pi^2 N_f(N_f+1)}'
    method: LOC
    refs: [chang2019]
    note: 'Chang et al. [@chang2019] give $C_T = 12\,[\cdots]/(\pi^2(N_f+1))$ for $N_f \ge 2$, in units where a free hypermultiplet has $C_T = 12$; divided here by $12N_f$. $\psi^{(1)}$ is the trigamma function. The expression also equals 1 at $N_f = 1$.'

operators:
  - name: '\tilde Q^a Q_b'
    Delta: 1
    spin: 0
    parity: unknown
    global: {SU(Nf): adjoint, U(1)_J: 0, SU(2)_H: adjoint, SU(2)_C: singlet}
    multiplet: {name: '$SU(N_f)$ flavor current', component: primary, type: '$(B,+)$', cdi: '$B_1[0]^{(2;0)}_1$'}
    method: exact
    refs: [klebanov2012]
    note: 'Higgs-branch moment map, bottom of the $SU(N_f)$ current multiplet ($N_f\ge2$).'
  - name: 'V_\pm'
    Delta: '\frac{N_f}{2}'
    spin: 0
    parity: pair
    global: {SU(Nf): singlet, U(1)_J: ±1, SU(2)_H: singlet, SU(2)_C: sym(N_f)}
    role: Coulomb-branch chiral operators
    multiplet: {name: '$V_\pm$', component: primary, type: '$(B,-)$', cdi: '$B_1[0]^{(0;N_f)}_{N_f/2}$'}
    method: exact
    refs: [borokhov2002, gaiotto2008]
    note: 'BPS monopole operators of unit magnetic charge; $\Delta$ equals their R-charge $N_f/2$.'
  - name: 'J_\mu'
    Delta: 2
    spin: 1
    parity: unknown
    global: {SU(Nf): [singlet, adjoint], U(1)_J: 0, SU(2)_H: singlet, SU(2)_C: singlet}
    multiplet: {name: flavor current, component: 'Q^2', type: '$(B,+)$ ($SU(N_f)$), $(B,-)$ ($U(1)_J$)', cdi: '$B_1[0]^{(2;0)}_1$ ($SU(N_f)$), $B_1[0]^{(0;2)}_1$ ($U(1)_J$)'}
    method: exact
    note: Conserved flavor and topological currents.
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    parity: even
    global: {SU(Nf): singlet, U(1)_J: 0, SU(2)_H: singlet, SU(2)_C: singlet}
    multiplet: {name: stress tensor, component: 'Q^4', type: conserved, cdi: '$A_2[0]^{(0;0)}_1$'}
    method: exact
    note: Stress tensor (conserved).

