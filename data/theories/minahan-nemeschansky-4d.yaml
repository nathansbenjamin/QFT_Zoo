id: minahan-nemeschansky-4d
name: Minahan–Nemeschansky theories
aliases:
  - 'Rank-one $E_6$, $E_7$, $E_8$ SCFTs'
  - '$E_n$ theories'
  - '$\mathcal{N}=2$ SCFTs with exceptional flavor symmetry'
d: 4
summary: >-
  The isolated rank-one $\mathcal{N}=2$ SCFTs with $E_6$, $E_7$ and $E_8$ flavor symmetry, whose
  Coulomb-branch operators have dimension 3, 4 and 6. They have no Lagrangian, and the $E_6$
  and $E_7$ theories appear at infinite coupling of conformal gauge theories.
tags: [CFT, SCFT, interacting, unitary, supersymmetric, non-Lagrangian, family]

description: |
  Minahan and Nemeschansky [@minahan1996; @minahan1996b] constructed the Seiberg–Witten curves and differentials of
  $\mathcal{N}=2$ SCFTs with a one-dimensional Coulomb branch and $E_6$, $E_7$ or $E_8$ global
  symmetry. At the conformal point the curves are $y^2 = x^3 - \rho^4$, $y^2 = x^3 - 2\rho^3 x$
  and $y^2 = x^3 - 2\rho^5$, the $E_n$ Kodaira singularities, and the Coulomb-branch operator
  has dimension 3, 4 and 6. The curves follow from requiring that the residues of the
  Seiberg–Witten differential be linear in the $E_n$ mass parameters, and mass deformations
  flow from $E_8$ to $E_7$, $E_6$ and $D_4$ ($SU(2)$ with four flavors). The theories live on a single D3-brane probing an $E_n$
  singularity of F-theory, in the same series as the Argyres–Douglas theories $H_0, H_1, H_2$.
  The Higgs branch is the one-instanton moduli space of $E_n$, generated by the moment map
  subject to the Joseph relations.

  Argyres and Seiberg [@argyres2007] found the $E_6$ and $E_7$ theories inside Lagrangian theories at infinite
  coupling. $SU(3)$ with six flavors is dual to an $SU(2)$ gauge theory with one fundamental
  hypermultiplet, coupled to the $E_6$ theory by gauging the $SU(2)$ in
  $SU(2)\times SU(6) \subset E_6$. $USp(4)$ with twelve fundamental half-hypermultiplets is dual
  to $SU(2)$ coupled to the $E_7$ theory, gauging the $SU(2)$ in $SU(2)\times SO(12) \subset E_7$.
  Conformality of the dual $SU(2)$ fixes $k_{E_6} = 6$ and $k_{E_7} = 8$. Aharony and Tachikawa [@aharony2007]
  computed $a$, $c$ and $k$ of all these theories, and of their higher-rank versions, from
  holography, and checked them against these dualities: subtracting the dual $SU(2)$ sector
  from $SU(3)$ with six flavors gives $a$ and $c$ of the $E_6$ theory. The $E_6$
  theory is also Gaiotto's $T_3$, the theory of three M5-branes on a sphere with three full
  punctures.

  The central charges saturate the unitarity bounds that follow from the chiral algebra, and
  the chiral algebra is conjectured to be the $E_n$ affine algebra at level $k_{2d} = -k/2$,
  that is $-3$, $-4$ and $-6$ [@beem2013, Sec. 4.3; @beem2014, Sec. 2.4]. In the numerical bootstrap of the moment-map
  four-point function, every $\mathcal{N}=2$ SCFT with at least $E_6$ flavor symmetry has
  $c \geq 0.83$. The $E_6$ theory lies where two analytic chiral-algebra bounds meet, but at
  $k = 6$ the numerical lower bound on $c$ appears to converge to between 1.1 and 1.2, below its
  value $13/6$. At the $E_6$ values of $c$ and $k$ the upper bound on the first unprotected
  singlet scalar extrapolates to about 4.4 [@beem2014].

family:
  parameter: G
  members:
    - at: 'E_6'
      label: '$E_6$ theory ($T_3$)'
      note: '$\Delta_u = 3$, $a = \tfrac{41}{24}$, $c = \tfrac{13}{6}$, $k_{E_6} = 6$.'
    - at: 'E_7'
      label: '$E_7$ theory'
      note: '$\Delta_u = 4$, $a = \tfrac{59}{24}$, $c = \tfrac{19}{6}$, $k_{E_7} = 8$.'
    - at: 'E_8'
      label: '$E_8$ theory'
      note: '$\Delta_u = 6$, $a = \tfrac{95}{24}$, $c = \tfrac{31}{6}$, $k_{E_8} = 12$.'

symmetry:
  spacetime: '4d $\mathcal{N}=2$ superconformal group (8 $Q$ + 8 $S$ supercharges); parity not recorded'
  euclidean: '$SO(5,1)$ (bosonic conformal part)'
  lorentzian: '$SU(2,2|2)$'
  supercharges: 8
  global: '$E_6$, $E_7$ or $E_8$ flavor symmetry; R-symmetry $SU(2)_R\times U(1)_r$'
  parity: false
  global_group:
    - {id: SU(2)_R, group: SU(2), tex: 'SU(2)_R'}
    - {id: U(1)_r, group: U(1), tex: 'U(1)_r', note: 'Normalized as in Dolan–Osborn: a Coulomb-branch chiral primary, in an $\mathcal{E}_{r(0,0)}$ multiplet, has $r = \Delta$.'}
    - {id: E_n, group: 'Lie(E_n)', note: '$E_6$, $E_7$ or $E_8$: one theory each.'}
  notes: 'Flavor central charges in the normalization where $SU(2)$ with four flavors has $k_{SO(8)} = 4$, and gauging $G$ is conformal when the matter has $k_G = 4h^\vee(G)$. Multiplet names follow Dolan and Osborn [@dolan2002] as tabulated by Beem et al. [@beem2013, Table 7]: $\mathcal{E}_{r(0,0)}$ Coulomb-branch chiral, $\hat{\mathcal{B}}_R$ Higgs-branch half-BPS, $\hat{\mathcal{C}}_{0(0,0)}$ stress tensor, $\mathcal{A}^{\Delta}_{R,r(j,\bar\jmath)}$ long. The label of Cordova, Dumitrescu and Intriligator [@cdi2016] is shown on hover; its $u(1)_r$ charge is twice the one here.'

quantities:
  - symbol: 'a'
    description: 'Euler conformal anomaly of the $E_6$, $E_7$, $E_8$ theories (a free real scalar has $a = \tfrac{1}{360}$)'
    value: '\tfrac{41}{24},\ \tfrac{59}{24},\ \tfrac{95}{24}'
    method: exact, holography; S-duality for E6, E7
    refs: [aharony2007, shapere2008, beem2014]
    note: 'Aharony–Tachikawa [@aharony2007, Table 2], which agrees with the Argyres–Seiberg dualities for $E_6$ and $E_7$; Shapere–Tachikawa [@shapere2008, Eq. (4.44)] reproduces them. For $E_6$: $a = \tfrac{29}{12} - \tfrac{17}{24}$ [@aharony2007, Eq. (5.3)].'
  - symbol: 'c'
    description: 'Weyl conformal anomaly of the $E_6$, $E_7$, $E_8$ theories (a free real scalar has $c = \tfrac{1}{120}$)'
    value: '\tfrac{13}{6},\ \tfrac{19}{6},\ \tfrac{31}{6}'
    method: exact, holography; S-duality for E6, E7
    refs: [aharony2007, beem2013, beem2014]
    note: 'Same sources as $a$; also predicted from the Higgs-branch relations by Beem et al. [@beem2013, Table 4].'
  - symbol: 'k'
    description: 'Flavor central charge $k_{E_6}$, $k_{E_7}$, $k_{E_8}$'
    value: '6,\ 8,\ 12'
    method: exact, S-duality; holography
    refs: [argyres2007, aharony2007]
    note: '$k_{E_6}$ and $k_{E_7}$ from [@argyres2007, Eqs. (3.6), (4.6)]; all three in [@aharony2007, Table 2].'
  - symbol: '\dim_{\mathbb{H}}\mathcal{M}_H'
    description: 'Quaternionic dimension of the Higgs branch'
    value: '11,\ 17,\ 29'
    method: exact, from a and c
    refs: [chacaltana2010, aharony2007]
    note: 'From $\dim_{\mathbb{H}}\mathcal{M}_H = n_h - n_v = 24(c-a)$ [@chacaltana2010] with the values of $a$ and $c$ above.'

operators:
  - name: 'u\ (E_6)'
    Delta: 3
    spin: 0
    global: {SU(2)_R: singlet, U(1)_r: 3, E_n: singlet}
    role: Coulomb-branch generator
    multiplet: {name: '$u$', component: primary, type: '$\mathcal{E}_{3(0,0)}$', cdi: '$L\bar B_1[0;0]^{(0;6)}_{3}$'}
    method: exact
    refs: [minahan1996, aharony2007]
  - name: 'u\ (E_7)'
    Delta: 4
    spin: 0
    global: {SU(2)_R: singlet, U(1)_r: 4, E_n: singlet}
    role: Coulomb-branch generator
    multiplet: {name: '$u$', component: primary, type: '$\mathcal{E}_{4(0,0)}$', cdi: '$L\bar B_1[0;0]^{(0;8)}_{4}$'}
    method: exact
    refs: [minahan1996b, aharony2007]
  - name: 'u\ (E_8)'
    Delta: 6
    spin: 0
    global: {SU(2)_R: singlet, U(1)_r: 6, E_n: singlet}
    role: Coulomb-branch generator
    multiplet: {name: '$u$', component: primary, type: '$\mathcal{E}_{6(0,0)}$', cdi: '$L\bar B_1[0;0]^{(0;12)}_{6}$'}
    method: exact
    refs: [minahan1996b, aharony2007]
  - name: '\mu'
    Delta: 2
    spin: 0
    global: {SU(2)_R: adjoint, U(1)_r: 0, E_n: adjoint}
    multiplet: {name: flavor current, component: primary, type: '$\hat{\mathcal{B}}_1$', cdi: '$B_1\bar B_1[0;0]^{(2;0)}_2$'}
    method: exact
    refs: [beem2014]
    note: 'Moment map, the superconformal primary of the flavor-current multiplet; it generates the Higgs-branch chiral ring.'
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    global: {SU(2)_R: singlet, U(1)_r: 0, E_n: singlet}
    multiplet: {name: stress tensor, component: 'Q^2\bar Q^2', type: '$\hat{\mathcal{C}}_{0(0,0)}$', cdi: '$A_2\bar A_2[0;0]^{(0;0)}_2$'}
    method: exact
    note: Stress tensor (conserved).

