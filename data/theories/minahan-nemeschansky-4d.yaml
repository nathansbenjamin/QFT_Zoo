relations:
  - type: related_to
    target: n2-sqcd-4d
    note: 'Argyres–Seiberg duality: $SU(3)$ with six flavors (the $N = 3$ member) at infinite coupling is $SU(2)$ with one fundamental hypermultiplet coupled to the $E_6$ theory. Mass deformation of the $E_6$ curve flows to the $D_4$ theory, $SU(2)$ with four flavors (the $N = 2$ member).'
  - type: related_to
    target: argyres-douglas-4d
    note: 'Same series of rank-one theories on a D3-brane at an F-theory singularity: $H_0, H_1, H_2, D_4, E_6, E_7, E_8$.'

