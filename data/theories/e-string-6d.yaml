id: e-string-6d
name: E-string theory
aliases:
  - 'Rank-$Q$ E-string theories'
  - 'Small $E_8$ instanton theory'
  - '6d $\mathcal{N}=(1,0)$ $E_8$ theory'
  - 'M5-branes on the $E_8$ end-of-the-world brane'
d: 6
summary: >-
  The 6d $(1,0)$ SCFT on $Q$ M5-branes inside the $E_8$ end-of-the-world brane of M-theory,
  equivalently $Q$ small $E_8$ instantons of the heterotic string. Flavor symmetry $E_8$
  ($E_8\times SU(2)$ for $Q\ge2$); its anomaly polynomial is known exactly.
tags: [CFT, SCFT, interacting, unitary, supersymmetric, non-Lagrangian, family]

description: |
  When an $E_8$ instanton of the $E_8\times E_8$ heterotic string shrinks to zero size, a
  tensionless non-critical string appears [@ganor1996a; @seiberg1996b], and the low-energy
  theory near the small instanton is an interacting 6d $(1,0)$ SCFT with $E_8$ flavor symmetry.
  In M-theory it lives on an M5-brane inside the $E_8$ end-of-the-world brane. $Q$ coincident
  M5-branes give the rank-$Q$ E-string theory together with a decoupled free hypermultiplet,
  the center-of-mass motion along the wall. Its tensor branch has dimension $Q$ and is reached
  by moving the M5-branes off the wall. The Higgs branch is the moduli space of $Q$ $E_8$
  instantons, of quaternionic dimension $30Q$; it is reached by dissolving the M5-branes into
  the wall. The R-symmetry is $SU(2)_R\subset SO(4)$, the rotations transverse to the branes
  within the wall. The other factor $SU(2)_L$ is a flavor symmetry; at $Q=1$ it acts only on the
  free hypermultiplet. Like every 6d $(1,0)$ SCFT, the theory has no relevant or marginal
  supersymmetric deformation.

  In F-theory the rank-1 theory comes from a single curve of self-intersection $-1$ in the base
  carrying no gauge algebra, and the rank-$Q$ theory from the chain of curves $1,2,\dots,2$
  (in minus the self-intersections). It is the glue of the F-theory classification: other 6d
  SCFTs are built by joining curves with gauge algebras through $-1$ curves, which gauges a
  subgroup of the $E_8$ of the E-string. The anomaly polynomial, computed by anomaly inflow
  [@ohmori2014a] and rederived from the circle compactification [@ohmori2014b], determines the anomalies below.

parameters:
  - symbol: 'Q'
    description: Rank (number of M5-branes).
    range: '$Q \geq 1$'

family:
  parameter: Q
  members:
    - at: 1
      label: 'Rank-1 E-string; flavor $E_8$'
      note: 'Without the free hypermultiplet: $(\alpha,\beta,\gamma,\delta) = (13, -\tfrac{11}{2}, \tfrac{203}{240}, -\tfrac{29}{60})$ and $a = \tfrac{9199}{210}$ (derived), $C_T = \tfrac{38136}{5}$, $C_J = 150$. One $-1$ curve.'
    - at: 2
      label: 'Flavor $E_8\times SU(2)$'
      note: '$a = \tfrac{1286}{7}$ with the free hypermultiplet (from the formula for $a$). Curves $1,2$.'

symmetry:
  spacetime: '6d $\mathcal{N}=(1,0)$ superconformal group (8 $Q$ + 8 $S$ supercharges); no parity (chiral)'
  euclidean: '$SO(7,1)$ (bosonic conformal part)'
  lorentzian: '$OSp(8^*|2)$'
  supercharges: 8
  global: 'Flavor $E_8$ for $Q=1$ and $E_8\times SU(2)_L$ for $Q\ge2$; R-symmetry $SU(2)_R$'
  parity: false
  global_group:
    - {id: SU(2)_R, group: SU(2), tex: 'SU(2)_R'}
    - {id: E8, group: E_8}
    - {id: SU(2)_L, group: SU(2), tex: 'SU(2)_L', note: 'Present for $Q \geq 2$.'}
  notes: 'Multiplet names follow Chang and Lin [@chang2017b, Sec. 2]: $\mathcal{D}[2]$ flavor current, $\mathcal{B}[0]_0$ stress tensor, $\mathcal{L}[0]_{\Delta,\ell}$ long, with $[R]$ the $SU(2)_R$ Dynkin label. The label of Cordova, Dumitrescu and Intriligator [@cdi2016] is shown on hover.'

quantities:
  - symbol: 'I_8'
    description: 'Anomaly polynomial, including the free hypermultiplet'
    value: 'Q^3\frac{p_2(N)}{6} + Q^2\frac{\chi_4(N)\,I_4}{2} + Q\left(\frac{I_4^2}{2} - J_8\right)'
    method: anomaly, inflow
    refs: [ohmori2014a]
    note: 'Ohmori–Shimizu–Tachikawa [@ohmori2014a, Eq. (1.1)], where their $I_8$ is called $J_8$ here: $I_4 = \tfrac14\left(p_1(N)+p_1(T)+\mathrm{Tr}F^2\right)$, $J_8 = \tfrac{1}{48}\left(p_2(N)+p_2(T)-\tfrac14(p_1(N)-p_1(T))^2\right)$. $N$ is the $SO(4)$ normal bundle with $p_1(N) = -2(c_2(R)+c_2(L))$, $\chi_4(N) = c_2(L)-c_2(R)$, $p_2(N) = \chi_4(N)^2$; $F$ is the $E_8$ background and Tr is the adjoint trace divided by 30. A Weyl fermion in the representation $\rho$ contributes $\hat A(T)\,\mathrm{tr}_\rho e^{iF}$. The free hypermultiplet contributes $\frac{7p_1(T)^2-4p_2(T)}{5760}+\frac{c_2(L)p_1(T)}{48}+\frac{c_2(L)^2}{24}$ [@ohmori2014a, Eq. (1.5)].'
  - symbol: '(\alpha,\beta,\gamma,\delta)'
    description: '''t Hooft anomalies in $I_8 = \frac{1}{4!}\left(\alpha c_2(R)^2 + \beta c_2(R)p_1(T) + \gamma p_1(T)^2 + \delta p_2(T)\right)$, including the free hypermultiplet'
    value: '\left(Q(4Q^2+6Q+3),\ -\tfrac{Q}{2}(6Q+5),\ \tfrac{7Q}{8},\ -\tfrac{Q}{2}\right)'
    method: anomaly, inflow
    refs: [cordova2015, ohmori2014a]
    note: 'Córdova–Dumitrescu–Intriligator [@cordova2015, Eq. (5.1)]; the same as the formula above with the flavor backgrounds set to zero. In this normalization a free hypermultiplet has $(0,0,\tfrac{7}{240},-\tfrac{1}{60})$ and a free tensor multiplet $(1,\tfrac12,\tfrac{23}{240},-\tfrac{29}{60})$.'
  - symbol: 'a'
    description: '$a$-type Weyl anomaly, normalized so that a free $(2,0)$ tensor multiplet has $a = 1$; including the free hypermultiplet'
    value: '\frac{64}{7}Q^3 + \frac{144}{7}Q^2 + \frac{99}{7}Q'
    method: anomaly
    refs: [cordova2015]
    note: 'Córdova–Dumitrescu–Intriligator [@cordova2015, Eq. (5.2)], from their formula $a = \tfrac{16}{7}(\alpha-\beta+\gamma)+\tfrac67\delta$, which assumes a universal linear relation between $a$ and the ''t Hooft anomalies. A free hypermultiplet has $a = \tfrac{11}{210}$. Moving one M5-brane off the wall gives $\Delta a = \tfrac{12}{7}(4Q+1)^2 > 0$ [@cordova2015, Eq. (5.5)].'
  - symbol: 'C_T'
    description: 'Stress-tensor two-point coefficient, normalized so that a free real scalar has $C_T = 6/5$ and a free hypermultiplet $84/5$; including the free hypermultiplet'
    value: '84\,Q\,(16Q^2+42Q+33)'
    method: anomaly, conjectured c3 relation
    refs: [chang2017b]
    note: 'Chang–Lin [@chang2017b, Eqs. (6.5)–(6.17)]: $C_T = 3024\,c_3$, with $c_3$ given by the linear relation of Beccaria and Tseytlin [@bt2015; @bt2017] between $c_3$ and $(\alpha,\beta,\gamma,\delta)$. Rank 1 without the free hypermultiplet: $C_T = \tfrac{38136}{5}$ [@chang2017b, Eq. (6.18)].'
  - symbol: 'C_J^{E_8}'
    description: '$E_8$ flavor central charge, in the normalization of Chang–Lin [@chang2017b, Sec. 6.2] (a free hypermultiplet has $C_J = 5/2$)'
    value: '60Q^2 + 90Q'
    method: anomaly
    refs: [chang2017b]
    note: 'Chang–Lin [@chang2017b, Eq. (6.25)]; $C_J = 150$ at rank 1. Their bootstrap bounds support the conjecture that this is the minimum among interacting SCFTs with $E_8$ flavor symmetry.'

operators:
  - name: '\mu^a_{(ij)}'
    Delta: 4
    spin: 0
    global: {SU(2)_R: adjoint, E8: adjoint, SU(2)_L: singlet}
    multiplet: {name: '$E_8$ flavor current', component: primary, type: '$\mathcal{D}[2]$', cdi: '$D_1[0,0,0]^{(2)}_4$'}
    method: exact
    refs: [chang2017b]
    note: 'Moment map, superconformal primary of the $E_8$ current multiplet. For $Q = 1$, with the free centre-of-mass hypermultiplet removed, it generates the Higgs-branch chiral ring [@chang2017b]; for $Q > 1$ the $SU(2)_L$ moment maps are further generators.'
  - name: 'J_\mu^a'
    Delta: 5
    spin: 1
    global: {SU(2)_R: singlet, E8: adjoint, SU(2)_L: singlet}
    multiplet: {name: '$E_8$ flavor current', component: 'Q^2', type: '$\mathcal{D}[2]$', cdi: '$D_1[0,0,0]^{(2)}_4$'}
    method: exact
    note: Conserved $E_8$ currents.
  - name: 'T_{\mu\nu}'
    Delta: 6
    spin: 2
    global: {SU(2)_R: singlet, E8: singlet, SU(2)_L: singlet}
    multiplet: {name: stress tensor, component: 'Q^4', type: '$\mathcal{B}[0]_0$', cdi: '$B_3[0,0,0]^{(0)}_4$'}
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: related_to
    target: seiberg-en-5d
    note: 'On a circle with $E_8$ Wilson lines, the rank-1 E-string gives the 5d Seiberg $E_n$ theories [@ganor1996b].'
  - type: related_to
    target: usp-5d
    note: 'On a circle with a holonomy breaking $E_8$ to $SO(16)$, the rank-$Q$ E-string gives 5d $USp(2Q)$ gauge theory with one antisymmetric and 8 fundamental hypermultiplets, one flavor more than the 5d SCFTs [@ohmori2014b, Sec. 2.4].'
  - type: related_to
    target: minahan-nemeschansky-4d
    note: 'On $T^2$ the rank-1 E-string gives the 4d $\mathcal{N}=2$ $E_8$ Minahan–Nemeschansky theory [@heckman2014].'

