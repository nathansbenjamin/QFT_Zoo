id: minimal-n4-scft-3d
name: '3d minimal $\mathcal{N}=4$ SCFT $\mathcal{T}_{\rm min}$'
aliases:
  - 'Minimal 3d $\mathcal{N}=4$ SCFT $\mathcal{T}_{\rm min}$'
  - '$\mathcal{N}=2$ $U(1)_{-3/2}$ Chern–Simons theory with one chiral of charge 1'
  - 'Gang–Yamazaki minimal $\mathcal{N}=4$ SCFT'
  - 'Rank-0 minimal $\mathcal{N}=4$ SCFT'
d: 3
summary: >-
  The infrared fixed point of 3d $\mathcal{N}=2$ $U(1)$ Chern–Simons theory at level $-3/2$
  with one chiral multiplet of charge 1, conjectured to have emergent $\mathcal{N}=4$
  supersymmetry. A rank-0 SCFT, proposed to be the 3d $\mathcal{N}=4$ SCFT with the smallest
  $F$ and non-zero $C_T$.
tags: [CFT, SCFT, interacting, unitary, gauge theory, supersymmetric, Lagrangian]

description: |
  The UV theory is an $\mathcal{N}=2$ $U(1)$ vector multiplet with Chern–Simons level $k=-3/2$
  coupled to one chiral multiplet $\Phi$ of gauge charge $+1$; the half-integer level is
  required by the quantization condition $k \in \mathbb{Z} + Q^2/2$. Gang et al. [@gang2021] use a
  duality between this theory and $U(1)_{3/2}$ with one chiral, so either sign of the level gives
  the same SCFT. $F$-maximization gives the superconformal R-charge $R_\Phi = 1/3$, assuming no
  emergent abelian flavor symmetry.

  Gang and Yamazaki [@gang2018] conjectured that the infrared SCFT has $\mathcal{N}=4$ supersymmetry, with
  the UV symmetries $U(1)_R\times U(1)_{\rm top}$ combining into the $SO(4)$ R-symmetry. Their
  evidence: the two-point coefficients of the $U(1)_R$ and $U(1)_{\rm top}$ currents computed by
  localization agree exactly; dressed monopole operators with the quantum numbers of the extra
  supercurrent multiplets appear in the semiclassical spectrum and the superconformal index; and
  two copies of the theory are dual to $T[SU(2)]$ with its diagonal $SU(2)$ gauged at
  Chern–Simons level 3 (later refined to include a decoupled $U(1)_2$ topological sector).

  The theory has no chiral primary operators that could parametrize a moduli space, so it has
  neither a Higgs nor a Coulomb branch (rank 0), and it admits no UV Lagrangian with manifest
  $\mathcal{N}=4$ supersymmetry. Gang, Kim, Lee, Shim and Yamazaki [@gang2021] associate a pair of
  non-unitary TQFTs with any rank-0 $\mathcal{N}=4$ SCFT; for $\mathcal{T}_{\rm min}$ both are
  the Lee–Yang TQFT. Their dictionary gives the lower bound
  $F \ge -\log\sqrt{(5-\sqrt5)/10}$ for rank-0 SCFTs, which $\mathcal{T}_{\rm min}$ saturates.
  The minimality of $F$ and $C_T$ is a conjecture.

symmetry:
  spacetime: '3d $\mathcal{N}=4$ superconformal group (8 $Q$ + 8 $S$ supercharges), conjectured emergent ($\mathcal{N}=2$, $OSp(2|4)$, manifest); with parity, which maps the UV level $k=-\tfrac32$ to $+\tfrac32$, a dual description'
  euclidean: '$O(4,1)$ (bosonic conformal part)'
  lorentzian: '$OSp(4|4)$'
  supercharges: 8
  global: 'No flavor symmetry; the UV $U(1)_R\times U(1)_{\rm top}$ is conjectured to become part of the $SO(4)$ R-symmetry'
  parity: true
  global_group:
    - {id: U(1)_R, group: U(1), tex: 'U(1)_R', note: 'The manifest $\mathcal{N}=2$ R-symmetry; with $U(1)_{\rm top}$ conjectured to become part of the $SO(4)$ R-symmetry.'}
    - {id: U(1)_top, group: U(1), tex: 'U(1)_{\rm top}'}
  notes: 'Multiplet names follow Dolan [@dolan2008] as used by Chester, Lee, Pufu and Yacoby [@clpy2014, Table 1]: $(B,+)$ and $(B,-)$ the half-BPS Higgs- and Coulomb-branch multiplets [@bpr2016, Sec. 2.1] (Dolan writes $(2,B,\pm)$), conserved the stress-tensor multiplet. Usage is split; the notation of Cordova, Dumitrescu and Intriligator [@cordova2016, Sec. 2.1.4] is shown on hover: $X[j]^{(R;R'')}_\Delta$, with $j$ twice the spin and $(R;R'')$ the Dynkin labels of the conjectured $SO(4)_R \simeq SU(2)\times SU(2)$ R-symmetry.'
  gauge: '$U(1)_{-3/2}$ (UV description)'

quantities:
  - key: F
    symbol: 'F'
    description: '$S^3$ free energy, $F = -\log|Z_{S^3}|$'
    value: '-\log\sqrt{\frac{5-\sqrt{5}}{10}} \approx 0.642965'
    method: LOC
    refs: [gang2021]
    note: 'Equals $\max_\alpha(-\log|S_{0\alpha}|)$ of the Lee–Yang TQFT in the dictionary of Gang et al. [@gang2021].'
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient, relative to one free chiral multiplet'
    value: '\frac{8}{25}\left(8 - \frac{5\sqrt{5+2\sqrt{5}}}{\pi}\right) \approx 0.992549'
    method: LOC
    refs: [gang2018]
    note: 'Gang et al. [@gang2021, Eq. (3.6)] print the prefactor as $8/26$; the value $0.992549$ requires $8/25$, as in [@gang2018].'
  - symbol: 'R_\Phi'
    description: 'Superconformal R-charge of $\Phi$ (from $F$-maximization)'
    value: '\frac{1}{3}'
    method: F-max
    refs: [gang2018]

operators:
  - name: '\hat\phi\hat\phi|{+1}\rangle,\ \ \hat\psi^*|{-1}\rangle'
    Delta: 2
    spin: 1
    parity: unknown
    global: {U(1)_R: 1, U(1)_top: ±1}
    method: semiclassical (monopole quantization)
    refs: [gang2018, gang2021]
    note: 'Dressed monopole operators; components of the two extra supercurrent multiplets, whose top components ($\Delta = 5/2$, spin $3/2$) are the extra supersymmetry currents.'
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    parity: even
    global: {U(1)_R: 0, U(1)_top: 0}
    multiplet: {name: stress tensor, component: 'Q^4', type: conserved, cdi: '$A_2[0]^{(0;0)}_1$'}
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: related_to
    target: t-sun-3d
    note: 'Gauging the diagonal $SU(2)$ of $T[SU(2)]$ at Chern–Simons level $|k|=3$ gives two copies of $\mathcal{T}_{\rm min}$ times a decoupled $U(1)_2$ topological sector.'

