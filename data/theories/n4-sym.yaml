    authors: Beisert et al.
    year: 2010
    arxiv: '1012.3982'
  - key: dolan2002
    title: On Short and Semi-Short Representations for Four Dimensional Superconformal Symmetry
    authors: Dolan, Osborn
    year: 2002
    journal: Annals Phys. 307 (2003) 41-89
    arxiv: hep-th/0209056
    doi: 10.1016/S0003-4916(03)00074-5
  - key: brvr2013
    title: 'The $\mathcal{N}=4$ Superconformal Bootstrap'
    authors: Beem, Rastelli, van Rees
    year: 2013
    journal: Phys. Rev. Lett. 111 (2013) 071601
    arxiv: '1304.1803'
    doi: 10.1103/PhysRevLett.111.071601
  - key: cdi2016
