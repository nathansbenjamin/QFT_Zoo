id: n4-sym
name: '$\mathcal{N}=4$ super Yang–Mills'
short_name: '4d $\mathcal{N}=4$ SYM'
aliases:
  - N=4 SYM
  - Maximally supersymmetric Yang–Mills in 4d
d: 4
summary: >-
  The maximally supersymmetric gauge theory in four dimensions: an exactly
  marginal family of superconformal theories, dual to type IIB string theory on
  $AdS_5\times S^5$.
tags: [CFT, SCFT, interacting, unitary, gauge theory, supersymmetric, Lagrangian, integrable, holographic, large N]

description: |
  A conformal manifold of SCFTs labelled by the gauge group (here $SU(N)$) and
  the complexified coupling $\tau = \frac{\theta}{2\pi} + \frac{4\pi i}{g^2_{\rm YM}}$.
  The field content is a single $\mathcal{N}=4$ vector multiplet: a gauge field,
  four Weyl fermions and six real scalars, all in the adjoint.

  Key features:
  - $\beta(g_{\rm YM}) = 0$ to all orders; $\tau$ is exactly marginal.
  - S-duality: $SL(2,\mathbb{Z})$ acting on $\tau$, exchanging $G$ with its Langlands dual.
  - The planar spectrum is computable at any 't Hooft coupling $\lambda = g^2_{\rm YM}N$ via integrability.
  - At large $N$ and strong coupling it is described by type IIB supergravity on $AdS_5\times S^5$.

lagrangian: '\mathcal{L} = \frac{1}{g_{\rm YM}^2}\,\mathrm{Tr}\Big( -\tfrac{1}{2}F_{\mu\nu}F^{\mu\nu} - D_\mu\phi^I D^\mu\phi^I + \tfrac{1}{2}[\phi^I,\phi^J]^2 + \text{fermions}\Big) + \frac{\theta}{8\pi^2}\,\mathrm{Tr}\,F\wedge F'

parameters:
  - symbol: 'N'
    description: Rank of the gauge group $SU(N)$.
    range: '$N \geq 2$'
  - symbol: '\tau'
    description: Complexified gauge coupling (exactly marginal).
    range: 'upper half-plane, modulo $SL(2,\mathbb{Z})$'

symmetry:
  spacetime: '4d $\mathcal{N}=4$ superconformal group (16 $Q$ + 16 $S$ supercharges), with parity at $\theta \in \{0, \pi\}$ (parity maps $\theta \to -\theta$)'
  euclidean: '$O(5,1)$ (bosonic conformal part)'
  lorentzian: '$PSU(2,2|4)$'
  supercharges: 16
  global: '$SU(4)_R$ R-symmetry'
  parity: conditional
  global_group:
    - {id: SU(4)_R, group: SU(4), tex: 'SU(4)_R'}
  gauge: '$SU(N)$'
  notes: 'Multiplet names follow Dolan and Osborn [@dolan2002, Sec. 5], as in the $\mathcal{N}=4$ bootstrap [@brvr2013]: $\mathcal{B}^{\frac12,\frac12}_{[0,p,0](0,0)}$ half-BPS, $\mathcal{A}^{\Delta}_{[k,p,q](j,\bar\jmath)}$ long. The label of Cordova, Dumitrescu and Intriligator [@cdi2016] is shown on hover.'

quantities:
  - symbol: 'a = c'
    description: 'Conformal anomalies (normalised so a free real scalar has $a=\tfrac{1}{360}$, $c=\tfrac{1}{120}$)'
    value: '\frac{N^2-1}{4}'
    method: exact
    note: Independent of $\tau$.

operators:
  - name: '\mathcal{O}_k = \mathrm{Tr}\,\phi^{\{I_1}\cdots\phi^{I_k\}}'
    family:
      id: half-BPS
      parameters:
        - {symbol: k, from: 2, to: N}
    Delta: 'k'
    spin: 0
    parity: unknown
    global: {SU(4)_R: 'Dynkin(0,k,0)'}
    multiplet: {name: '$\mathcal{O}_k$', component: primary, type: '$\mathcal{B}^{\frac12,\frac12}_{[0,k,0](0,0)}$', cdi: '$B_1\bar B_1[0;0]^{(0,k,0)}_k$'}
    method: exact
    refs: [maldacena1997]
    note: 'Single-trace half-BPS superconformal primaries (symmetric traceless products of the six scalars), dual to the Kaluza–Klein modes on $S^5$; $\Delta = k$ is protected at every $\tau$. For $SU(N)$ the traces with $k > N$ are products of these. Multi-trace half-BPS operators in the same representations (from $k = 4$) are not listed. Parity not recorded: it acts on the six scalars by a reflection in $O(6)$, not by a sign.'
  - name: '\mathcal{O}_{\mathbf{20}^\prime} = \mathrm{Tr}\,\phi^{\{I}\phi^{J\}}'
    member_of: half-BPS
    at: {k: 2}
    Delta: 2
    spin: 0
    parity: even
    global: {SU(4)_R: 'Dynkin(0,2,0)'}
    multiplet: {name: stress tensor, component: primary, type: '$\mathcal{B}^{\frac12,\frac12}_{[0,2,0](0,0)}$', cdi: '$B_1\bar B_1[0;0]^{(0,2,0)}_2$'}
    method: exact
    note: 'Half-BPS superconformal primary of the stress-tensor multiplet; protected.'
  - name: '\mathcal{K} = \mathrm{Tr}\,\phi^I\phi^I'
    Delta: '2 + \frac{3\lambda}{4\pi^2} + O(\lambda^2)'
    spin: 0
    parity: even
    global: {SU(4)_R: singlet}
    multiplet: {name: Konishi, component: primary, type: '$\mathcal{A}^{\Delta}_{[0,0,0](0,0)}$', cdi: '$L\bar L[0;0]^{(0,0,0)}_\Delta$'}
    method: PT
    note: 'Konishi operator, the lightest unprotected operator; $\lambda = g^2_{\rm YM}N$, planar.'
    refs: [beisert2010]

references:
