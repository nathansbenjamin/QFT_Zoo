    doi: 10.1007/JHEP03(2019)163

relations:
  - type: flows_to
    target: yang-mills-4d
    note: 'Give masses to all adjoint scalars and fermions ("$\mathcal{N}=0^*$"); below the mass scale the theory is pure Yang–Mills.'

