id: lee-yang-3d
name: '3d Lee–Yang edge singularity CFT'
aliases:
  - Yang–Lee edge singularity
  - 3d Yang–Lee CFT
  - '$i\phi^3$ fixed point'
d: 3
summary: >-
  The non-unitary CFT at the Lee–Yang edge singularity, the end of the line of
  partition-function zeros of the Ising model in an imaginary magnetic field above $T_c$.
  It is the fixed point of one scalar with an imaginary cubic coupling and has a single
  relevant primary, $\phi$.
tags: [CFT, interacting, non-unitary, Lagrangian, critical phenomena]

description: |
  Above the critical temperature, the zeros of the Ising partition function in the
  complex magnetic field $h$ lie on the imaginary axis beyond a critical value $h_c(T)$
  [@lee1952]. Near this edge their density vanishes as $(h - h_c)^\sigma$, with a
  universal edge exponent $\sigma$. Fisher [@fisher1978] described the edge by a scalar field theory with
  an imaginary cubic coupling, whose upper critical dimension is 6. The same universality
  class describes the repulsive-core singularity of fluids, and, in $d + 2$ dimensions,
  branched polymers [@parisi1981].

  The only relevant primary is $\phi$. By the equation of motion $\phi^2$ is a descendant
  of $\phi$, and the next scalar primary, "$\phi^3$", is irrelevant [@gliozzi2014]. The
  exponents follow from $\Delta_\phi$:
  $$\sigma = \frac{\Delta_\phi}{3 - \Delta_\phi}, \qquad \eta = 2\Delta_\phi - 1 .$$
  $\Delta_\phi \approx 0.21$ lies below the unitarity bound $\tfrac12$. In $d=2$ the
  same universality class is the minimal model $\mathcal{M}(2,5)$.

  The estimates below come from methods with different, not directly comparable, error
  estimates: the $6-\epsilon$ expansion to five loops with resummation [@borinsky2021];
  series expansions of the dimer density on bipartite lattices [@butera2012]; the
  functional renormalization group [@an2016]; a truncated, non-rigorous bootstrap that
  keeps a few operators in the $\phi\times\phi$ OPE [@gliozzi2014], since the positivity-based numerical bootstrap
  does not apply to a non-unitary theory; and the fuzzy-sphere regularization of the
  Ising model with an imaginary longitudinal field. Two fuzzy-sphere studies disagree.
  Arguello Cruz, Klebanov, Tarnopolsky and Xin [@arguellocruz2025] find $\Delta_\phi = 0.214(2)$, consistent
  with the series and five-loop values. Fan, Dong and Vishwanath [@fan2025] find
  $\Delta_\phi \approx 0.29$, and note that assuming a heavier next irrelevant operator in
  their finite-size fit moves it towards the other estimates. Elias Miró and Delouche [@eliasmiro2025] find
  the low-lying fuzzy-sphere spectrum compatible with the five-loop estimates.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2 + \tfrac{i\lambda}{3!}\,\phi^3 \quad (\phi \text{ real; the relevant coupling to } \phi \text{ is tuned to the edge})'

symmetry:
  spacetime: '3d conformal group with parity; Euclidean only (non-unitary statistical model)'
  euclidean: '$O(4,1)$'
  supercharges: 0
  global: 'None (the Ising $\mathbb{Z}_2$ is broken by the imaginary field)'
  parity: true
  global_group: []
  notes: 'Not unitary. The action has a $\mathcal{PT}$ symmetry, $\phi \to -\phi$ combined with $i \to -i$; the quantum Hamiltonians that realize the critical point are non-Hermitian but $\mathcal{PT}$-symmetric.'

quantities:
  - symbol: '\sigma'
    description: 'Edge exponent, $\sigma = \Delta_\phi/(3-\Delta_\phi)$'
    value: '0.075(11)'
    method: 'ε-exp, 6 − ε, five loops, resummed'
    refs: [borinsky2021]
    note: 'Combination of all resummations [@borinsky2021, Table 4]; constrained resummations alone give $0.075(7)$.'
  - symbol: '\sigma'
    description: 'Edge exponent, from the dimer density on the simple cubic lattice'
    value: '0.077(2)'
    method: series
    refs: [butera2012]
    note: 'Body-centred cubic lattice: $0.076(2)$.'
  - symbol: '\sigma'
    description: Edge exponent
    value: '0.0742(56)'
    method: FRG
    refs: [an2016]
  - symbol: '\sigma'
    description: Edge exponent
    value: '0.085(1)'
    method: CB-trunc
    refs: [gliozzi2014]
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 1$'
    value: '-0.57(2)'
    method: 'ε-exp, 6 − ε, five loops, resummed'
    refs: [borinsky2021]
    note: '[@borinsky2021, Table 1].'
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 1$'
    value: '-0.586(29)'
    method: FRG
    refs: [an2016]

three_point_functions:
  - operators: ['\phi', '\phi', '\phi']
    values:
      - structure: scalar
        symbol: '|C_{\phi\phi\phi}|'
        value_of: modulus
        value: '1.9696(31)'
        method: FS
        refs: [arguellocruz2025]
        note: 'From matrix elements of the fuzzy-sphere observable $Z_\ell$; from $X_\ell$, $1.969(5)$. The truncated bootstrap gives $C_{\phi\phi\phi}^2 = -3.88(1)$ [@gliozzi2014]: the coefficient is imaginary.'

operators:
  - name: '\phi'
    Delta: '0.214(2)'
    spin: 0
    parity: even
    role: the only relevant primary
    method: FS
    refs: [arguellocruz2025]
    note: 'Below the unitarity bound.'
  - name: '\phi'
    Delta: '0.215(10)'
    spin: 0
    parity: even
    role: the only relevant primary
    method: 'ε-exp, 6 − ε, five loops, resummed, from η'
    refs: [arguellocruz2025, borinsky2021]
    note: 'Listed by Arguello Cruz et al. [@arguellocruz2025], from the five-loop $\eta$ [@borinsky2021].'
  - name: '\phi'
    Delta: '0.214(6)'
    spin: 0
    parity: even
    role: the only relevant primary
    method: series, from σ
    refs: [arguellocruz2025, butera2012]
    note: 'Listed by Arguello Cruz et al. [@arguellocruz2025], from the series value of $\sigma$ [@butera2012].'
  - name: '\phi'
    Delta: '0.29'
    spin: 0
    parity: even
    role: the only relevant primary
    method: FS
    refs: [fan2025]
    note: 'No error quoted.'
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    parity: even
    method: exact
    note: Stress tensor (conserved).
  - name: '\phi^3'
    Delta: '4.613(6)'
    spin: 0
    parity: even
    method: FS
    refs: [arguellocruz2025]
    note: 'Leading irrelevant scalar.'
  - name: '\phi^3'
    Delta: '4.5(2)'
    spin: 0
    parity: even
    method: 'ε-exp, 6 − ε, five loops, resummed, from ω'
    refs: [borinsky2021]
    note: '$3 + \omega$ with the five-loop $\omega = 1.5(2)$.'
  - name: '\phi^3'
    Delta: '5.0(1)'
    spin: 0
    parity: even
    method: CB-trunc
    refs: [gliozzi2014]
  - name: '\phi^3'
    Delta: '4.71'
    spin: 0
    parity: even
    method: FS
    refs: [fan2025]
    note: 'No error quoted.'
  - name: 'Q_{\mu\nu\rho\sigma}'
    Delta: '4.9(1)'
    spin: 4
    parity: even
    method: FS
    refs: [arguellocruz2025]
    note: 'Lightest spin-4 primary.'
  - name: 'Q_{\mu\nu\rho\sigma}'
    Delta: '4.75(1)'
    spin: 4
    parity: even
    method: CB-trunc
    refs: [gliozzi2014]
  - name: 'Q_{\mu\nu\rho\sigma}'
    Delta: '4.90'
    spin: 4
    parity: even
    method: FS
    refs: [fan2025]
    note: 'No error quoted.'

relations:
