id: o3-model-3d
name: 3d $O(3)$ model
aliases:
  - Heisenberg universality class
  - '$O(3)$ Wilson–Fisher fixed point'
  - Critical 3d Heisenberg model
d: 3
uv_dof: 3
summary: >-
  The conformal field theory of the 3d Heisenberg universality class: the
  infrared fixed point of three real scalars with an $O(3)$-invariant quartic
  interaction. It describes the Curie transition of isotropic magnets.
tags: [CFT, interacting, unitary, Lagrangian, critical phenomena]

description: |
  Describes the ferromagnetic and antiferromagnetic transitions of isotropic
  (Heisenberg) magnets. In $2+1$ dimensions it describes the transition between
  Néel order and a paramagnet in dimerized quantum antiferromagnets. It is the IR
  endpoint of the flow from three free real scalars triggered by the
  $O(3)$-invariant quartic coupling, with the mass tuned to criticality.

  The lightest scalars are the vector $\phi$ (the order parameter), the rank-2
  symmetric traceless tensor $t$, and the singlet $s$ (the thermal operator). The
  tensor $t$ is a uniaxial anisotropy, and it is strongly relevant. An easy axis
  drives the flow to the 3d Ising CFT, and an easy plane drives it to the 3d
  $O(2)$ model.

  The lightest rank-4 scalar $t_4$ is relevant, but only barely: the bootstrap
  proves $\Delta_{t_4} < 2.99056$, and Monte Carlo gives $\Delta_{t_4} = 2.9858(6)$.
  So the $O(3)$ fixed point is unstable to cubic anisotropy, and magnets on a cubic
  lattice ultimately flow to the cubic fixed point. The flow is extremely slow, and
  the critical exponents barely change: $\nu_{\rm cubic} - \nu_{O(3)} = -0.00061(10)$.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\vec\phi)^2 + \tfrac{1}{2} m^2 \vec\phi^{\,2} + \tfrac{\lambda}{4!}(\vec\phi^{\,2})^2, \quad \vec\phi\in\mathbb{R}^3 \quad (m^2 \text{ tuned to criticality, flow to the IR})'

symmetry:
  spacetime: '3d conformal group with parity'
  euclidean: '$O(4,1)$'
  lorentzian: '$O(3,2)$'
  supercharges: 0
  global: '$O(3)$'
  parity: true
  global_group:
    - {id: O(3), group: O(3)}

quantities:
  - symbol: '\nu'
    description: 'Correlation-length exponent, $\nu = 1/(3-\Delta_s)$'
    value: '0.71164(10)'
    method: MC, improved icosahedral model
    refs: [hasenbusch2020]
  - symbol: '\nu'
    description: 'Correlation-length exponent, $\nu = 1/(3-\Delta_s)$'
    value: '0.71168(41)'
    method: CB, rigorous
    refs: [chester2020]
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 1$'
    value: '0.03784(5)'
    method: MC, improved icosahedral model
    refs: [hasenbusch2020]
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 1$'
    value: '0.03787(13)'
    method: CB, rigorous
    refs: [chester2020]
  - symbol: '\alpha'
    description: 'Specific-heat exponent, $\alpha = 2 - 3\nu$'
    value: '-0.1349(3)'
    method: MC, from ν
    refs: [hasenbusch2020]
  - symbol: '\omega'
    description: 'Leading correction-to-scaling exponent, $\omega = \Delta_{s^\prime} - 3$'
    value: '0.759(2)'
    method: MC
    refs: [hasenbusch2020]
  - symbol: 'Y_4'
    description: 'RG eigenvalue of the cubic perturbation, $Y_4 = 3 - \Delta_{t_4}$'
    value: '0.0142(6)'
    method: MC
    refs: [hasenbusch2023]
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient, relative to three free real scalars'
    value: '0.944524(28)'
    method: CB, non-rigorous error
    refs: [chester2020]
  - symbol: 'C_J/C_J^{\rm free}'
    description: 'Current two-point coefficient, relative to three free real scalars'
    value: '0.90632(16)'
    method: CB, non-rigorous error
    refs: [chester2020]

three_point_structures:
  - id: 'chester2020-tts'
    symbol: '\lambda'
    name: '$\delta^{i_1j_1}\delta^{i_2j_2}$'
    ref: 'chester2020, App. C, Eq. (32)'
    form: '\langle t^{i_1i_2}(x_1)\,t^{j_1j_2}(x_2)\,s(x_3)\rangle = \lambda_{tts}\,\frac{\delta^{i_1j_1}\delta^{i_2j_2}}{x_{12}^{2\Delta_t-\Delta_s}\,x_{23}^{\Delta_s}\,x_{31}^{\Delta_s}}'
    description: 'Indices of one letter symmetric and traceless; operators normalized as in [@chester2020, Eq. (13)]. The tensor is inferred from the paper''s four-point structures.'
    derivation: '$t$ is the symmetric traceless tensor ($\mathbf 2^+$) and $s$ the singlet ($\mathbf 0^+$) of $O(3)$; indices with the same letter are symmetrized with their trace removed, and the operators are normalized as $\langle s s\rangle = x_{12}^{-2\Delta_s}$, $\langle\phi^i\phi^j\rangle = \delta^{ij}x_{12}^{-2\Delta_\phi}$, $\langle t^{i_1i_2}t^{j_1j_2}\rangle = \delta^{i_1j_1}\delta^{i_2j_2}x_{12}^{-2\Delta_t}$ [@chester2020, Eq. (13), p. 10]. The paper defines its coefficients by the conformal block expansion $\sum_O(-1)^\ell\lambda_{\varphi_1\varphi_2O}\lambda_{\varphi_3\varphi_4O}T^{\mathcal R}g_{\Delta,\ell}$ of four-point functions [@chester2020, Eq. (11)], with blocks normalized as in [@poland2019, Table I, second line] and four-point $O(3)$ structures $T^{\mathcal R}$ [@chester2020, App. C, Eqs. (29), (32), pp. 26–28] normalized to make the coefficients consistent under permutations, checked in free theory [@chester2020, Eq. (33)]; it does not write the three-point tensors. This tensor is inferred from them (not stated by the source): contracted over the exchanged operator it reproduces $T^{\mathbf 0^+}_{\mathbf 2^+\mathbf 2^+\mathbf 0^+\mathbf 0^+} = B_{ttss}$, $T^{\mathbf 2^+}_{\mathbf 2^+\mathbf 0^+\mathbf 2^+\mathbf 0^+} = B_{tsts}$, $T^{\mathbf 0^+}_{\mathbf 2^+\mathbf 2^+\mathbf 2^+\mathbf 2^+} = B^1_{tttt}$ and $T^{\mathbf 0^+}_{\mathbf 2^+\mathbf 2^+\mathbf 1^-\mathbf 1^-} = B^1_{tt\phi\phi}$ exactly (checked numerically). The spacetime dependence is that of three scalars.'
  - id: 'chester2020-phiphit'
    symbol: '\lambda'
    name: '$\sqrt2\,\delta^{ik_1}\delta^{jk_2}$'
    ref: 'chester2020, App. C, Eq. (32)'
    form: '\langle \phi^i(x_1)\,\phi^j(x_2)\,t^{k_1k_2}(x_3)\rangle = \sqrt{2}\,\lambda_{\phi\phi t}\,\frac{\delta^{ik_1}\delta^{jk_2}}{x_{12}^{2\Delta_\phi-\Delta_t}\,x_{23}^{\Delta_t}\,x_{31}^{\Delta_t}}'
    description: 'Indices of one letter symmetric and traceless; operators normalized as in [@chester2020, Eq. (13)]. The tensor is inferred from the paper''s four-point structures.'
    derivation: '$\phi$ is the vector ($\mathbf 1^-$) and $t$ the symmetric traceless tensor ($\mathbf 2^+$) of $O(3)$; indices $k$ are symmetrized with their trace removed, operators normalized as in [@chester2020, Eq. (13), p. 10]. As for $\langle tts\rangle$, the paper defines the coefficient through four-point structures [@chester2020, Eqs. (11), (32)] and does not write this tensor; it is inferred from them (not stated by the source): with the factor $\sqrt2$ it reproduces exactly (checked numerically) $T^{\mathbf 2^+}_{\mathbf 1^-\mathbf 1^-\mathbf 1^-\mathbf 1^-} = B^2_{\phi\phi\phi\phi}+B^3_{\phi\phi\phi\phi}-\frac23B^1_{\phi\phi\phi\phi}$, $T^{\mathbf 1^-}_{\mathbf 2^+\mathbf 1^-\mathbf 2^+\mathbf 1^-} = 2B^2_{t\phi t\phi}$, $T^{\mathbf 2^+}_{\mathbf 1^-\mathbf 1^-\mathbf 0^+\mathbf 2^+} = \sqrt2 B_{\phi\phi st}$ and, with $\langle ttt\rangle$, $T^{\mathbf 2^+}_{\mathbf 2^+\mathbf 2^+\mathbf 1^-\mathbf 1^-}$. In free theory, $t^{ij} = (\phi^i\phi^j - \text{trace})/\sqrt2$ [@chester2020, Eq. (33)] gives $\lambda_{\phi\phi t} = 1$ in this structure.'
  - id: 'chester2020-ttt'
    symbol: '\lambda'
    name: '$\sqrt2\,\delta^{i_1j_1}\delta^{i_2k_1}\delta^{j_2k_2}$'
    ref: 'chester2020, App. C, Eq. (32)'
    form: '\langle t^{i_1i_2}(x_1)\,t^{j_1j_2}(x_2)\,t^{k_1k_2}(x_3)\rangle = \sqrt{2}\,\lambda_{ttt}\,\frac{\delta^{i_1j_1}\delta^{i_2k_1}\delta^{j_2k_2}}{(x_{12}\,x_{23}\,x_{31})^{\Delta_t}}'
    description: 'Indices of one letter symmetric and traceless; operators normalized as in [@chester2020, Eq. (13)]. The tensor is inferred from the paper''s four-point structures.'
    derivation: '$t$ is the symmetric traceless tensor ($\mathbf 2^+$) of $O(3)$; indices with the same letter are symmetrized with their trace removed, operators normalized as in [@chester2020, Eq. (13), p. 10]. As for $\langle tts\rangle$, the paper defines the coefficient through four-point structures [@chester2020, Eqs. (11), (32)] and does not write this tensor; it is inferred from them (not stated by the source): with the factor $\sqrt2$ it reproduces exactly (checked numerically) $T^{\mathbf 2^+}_{\mathbf 2^+\mathbf 2^+\mathbf 2^+\mathbf 2^+} = B^4_{tttt}+B^5_{tttt}-\frac23B^1_{tttt}$, $T^{\mathbf 2^+}_{\mathbf 0^+\mathbf 2^+\mathbf 2^+\mathbf 2^+} = \sqrt2 B_{sttt}$ and, with $\langle\phi\phi t\rangle$, $T^{\mathbf 2^+}_{\mathbf 2^+\mathbf 2^+\mathbf 1^-\mathbf 1^-} = B^2_{tt\phi\phi}+B^3_{tt\phi\phi}-\frac23B^1_{tt\phi\phi}$.'

