id: o2-model-3d
name: 3d $O(2)$ model
aliases:
  - XY universality class
  - '$O(2)$ Wilson–Fisher fixed point'
  - Critical 3d XY model
d: 3
uv_dof: 2
summary: >-
  The conformal field theory of the 3d XY universality class: the infrared
  fixed point of a complex scalar with a $|\phi|^4$ interaction. It describes the
  superfluid transition of helium-4.
tags: [CFT, interacting, unitary, Lagrangian, critical phenomena]

description: |
  Describes the λ transition of superfluid helium-4, easy-plane magnets, and, in
  $2+1$ dimensions, the superfluid–Mott insulator transition of bosons at integer
  filling. It is the IR endpoint of the flow from two free real scalars triggered
  by the $O(2)$-invariant quartic coupling, with the mass tuned to criticality.

  The lightest scalars in each charge sector are the singlet $s$ (the thermal
  operator), the charge-1 order parameter $\phi$, and the charge-2 $t$. Charge-3
  scalars are also relevant ($\Delta \approx 2.108$), but the lightest charge-4 scalar
  is irrelevant ($\Delta \approx 3.112$). So a $\mathbb{Z}_q$ clock anisotropy
  is irrelevant for $q \ge 4$, and $O(2)$ symmetry emerges at the transition of clock
  models. Monte Carlo simulations use this to get the most precise exponents.
  The dimensions of the lowest charge-$q$ operators agree with the large-charge
  effective theory down to $q = 4$.

  Bootstrap and Monte Carlo agree. Both disagree with the specific-heat exponent
  $\alpha$ measured near the λ point of helium in microgravity, by about $8\sigma$
  ($\alpha = 2 - 3\nu = -0.01515(7)$ from the Monte Carlo $\nu$, against
  $-0.0127(3)$ measured). This discrepancy is unresolved.

  By particle–vortex duality, the same fixed point is the critical point of a
  charged scalar coupled to a $U(1)$ gauge field (the Abelian Higgs model, in its
  "inverted XY" regime). The global $O(2)$ of one description is the topological
  $U(1)$ of the other.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\vec\phi)^2 + \tfrac{1}{2} m^2 \vec\phi^{\,2} + \tfrac{\lambda}{4!}(\vec\phi^{\,2})^2, \quad \vec\phi\in\mathbb{R}^2 \quad (m^2 \text{ tuned to criticality, flow to the IR})'

symmetry:
  spacetime: '3d conformal group with parity'
  euclidean: '$O(4,1)$'
  lorentzian: '$O(3,2)$'
  supercharges: 0
  global: '$O(2) = U(1) \rtimes \mathbb{Z}_2^C$'

quantities:
  - symbol: '\nu'
    description: 'Correlation-length exponent, $\nu = 1/(3-\Delta_s)$'
    value: '0.67172(2)'
    method: MC, improved clock model
    refs: [hasenbusch2025]
    note: 'From $1/\nu = 1.48872(5)$.'
  - symbol: '\nu'
    description: 'Correlation-length exponent, $\nu = 1/(3-\Delta_s)$'
    value: '0.67175(10)'
    method: CB, rigorous
    refs: [chester2019]
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 1$'
    value: '0.03816(2)'
    method: MC, improved clock model
    refs: [hasenbusch2025]
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 1$'
    value: '0.038176(44)'
    method: CB, rigorous
    refs: [chester2019]
  - symbol: '\alpha'
    description: 'Specific-heat exponent, $\alpha = 2 - 3\nu$ (theory)'
    value: '-0.01515(7)'
    method: MC, from ν
    refs: [hasenbusch2025]
  - symbol: '\alpha_{\rm exp}'
    description: 'Specific-heat exponent measured at the λ point of helium-4 (Space Shuttle experiment)'
    value: '-0.0127(3)'
    method: expt
    refs: [lipa2003]
    note: 'About $8\sigma$ from the theoretical value; unresolved.'
  - symbol: '\omega'
    description: 'Leading correction-to-scaling exponent, $\omega = \Delta_{s^\prime} - 3$'
    value: '0.789(4)'
    method: MC
    refs: [hasenbusch2019]
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient, relative to two free real scalars'
    value: '0.944056(15)'
    method: CB, non-rigorous error
    refs: [chester2019]
  - symbol: 'C_J/C_J^{\rm free}'
    description: 'Current two-point coefficient, relative to two free real scalars; it gives the zero-temperature conductivity, $2\pi\sigma_\infty = 0.355155(11)$'
    value: '0.904395(28)'
    method: CB, non-rigorous error
    refs: [chester2019]

three_point_structures:
  - id: 'chester2019-tts'
    symbol: '\lambda'
    name: '$(y_1\cdot y_2)^2$'
    ref: 'chester2019, Eqs. (11)–(13)'
    form: '\langle t(x_1,y_1)\,t(x_2,y_2)\,s(x_3)\rangle = \lambda_{tts}\,\frac{(y_1\cdot y_2)^2}{x_{12}^{2\Delta_t-\Delta_s}\,x_{23}^{\Delta_s}\,x_{31}^{\Delta_s}}'
    description: '$t(x,y) = t^{ij}(x)\,y_iy_j$ with null $y$; operators unit-normalized [@chester2019, Eq. (8)].'
    derivation: '$t$ is the charge-2 ($\mathbf 2$) and $s$ the singlet ($\mathbf 0^+$) scalar of $O(2)$, contracted with null polarizations $y$ ($y\cdot y = 0$), $t(x,y) = t^{ij}(x)y_iy_j$ [@chester2019, Eq. (8)]. The three-point function is $\lambda_{\varphi_1\varphi_2O}T_{\mathcal R_1\mathcal R_2\mathcal R_3}(y_1,y_2,y_3)$ times the three-scalar structure, with the flavor structure $T_{\mathbf q\mathbf q\mathbf 0^+} = (y_1\cdot y_2)^q$ [@chester2019, Eqs. (11), (13), p. 11], and the operators normalized as $\langle ss\rangle = x_{12}^{-2\Delta_s}$, $\langle\phi\phi\rangle = (y_1\cdot y_2)\,x_{12}^{-2\Delta_\phi}$, $\langle tt\rangle = (y_1\cdot y_2)^2x_{12}^{-2\Delta_t}$ [@chester2019, Eq. (16)]; blocks normalized as in [@poland2019, Table I, second line].'
  - id: 'chester2019-phiphit'
    symbol: '\lambda'
    name: '$(y_2\cdot y_3)(y_3\cdot y_1)$'
    ref: 'chester2019, Eqs. (11)–(13)'
    form: '\langle \phi(x_1,y_1)\,\phi(x_2,y_2)\,t(x_3,y_3)\rangle = \lambda_{\phi\phi t}\,\frac{(y_2\cdot y_3)\,(y_3\cdot y_1)}{x_{12}^{2\Delta_\phi-\Delta_t}\,x_{23}^{\Delta_t}\,x_{31}^{\Delta_t}}'
    description: '$\phi(x,y)$, $t(x,y)$ contracted with null $y$; operators unit-normalized [@chester2019, Eq. (8)].'
    derivation: '$\phi$ is the charge-1 ($\mathbf 1$) and $t$ the charge-2 ($\mathbf 2$) scalar of $O(2)$, contracted with null polarizations $y$ [@chester2019, Eq. (8)]. The flavor structure is $T_{\mathbf q_1\mathbf q_2\mathbf q_3} = (y_1\cdot y_2)^{\frac{q_1+q_2-q_3}{2}}(y_2\cdot y_3)^{\frac{q_2+q_3-q_1}{2}}(y_3\cdot y_1)^{\frac{q_3+q_1-q_2}{2}}$ at $q_1 = q_2 = 1$, $q_3 = 2$ [@chester2019, Eqs. (11), (13), p. 11]; operators normalized as in [@chester2019, Eq. (16)], blocks as in [@poland2019, Table I, second line].'

