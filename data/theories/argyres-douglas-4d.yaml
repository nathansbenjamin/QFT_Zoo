id: argyres-douglas-4d
name: Argyres–Douglas theories
aliases:
  - 'Rank-one Argyres–Douglas theories $H_0$, $H_1$, $H_2$'
  - '$(A_1, A_2)$, $(A_1, A_3)$ and $(A_1, D_4)$ theories'
  - 'Argyres–Plesser–Seiberg–Witten fixed points of $SU(2)$ with $N_f = 1, 2, 3$'
d: 4
summary: >-
  Isolated, non-Lagrangian $\mathcal{N}=2$ SCFTs at points of the Coulomb branch where mutually
  non-local BPS particles become massless. The rank-one members $H_0$, $H_1$, $H_2$ arise in
  $SU(2)$ with $N_f = 1, 2, 3$ flavors and have Coulomb-branch operators of dimension $6/5$,
  $4/3$, $3/2$.
tags: [CFT, SCFT, interacting, unitary, supersymmetric, non-Lagrangian, family]

description: |
  Argyres and Douglas [@argyres1995] showed that pure $\mathcal{N}=2$ $SU(N)$ gauge theory with $N > 2$ has
  vacua in which mutually non-local dyons become massless, such as the $\mathbb{Z}_3$ point of
  $SU(3)$, and proposed that the low-energy theory there is an interacting $\mathcal{N}=2$ SCFT.
  Argyres, Plesser, Seiberg and Witten [@argyres1995b] found fixed points of the same kind in $SU(2)$ with
  $N_f = 1, 2, 3$ fundamental flavors, at points where a monopole and $N_f$ quarks become
  massless together; the $N_f = 1$ point is the same SCFT as the $SU(3)$ one. These are the
  rank-one theories $H_0$, $H_1$, $H_2$. The dimension $\Delta_u$ of the Coulomb-branch
  operator $u$ follows from the scale-invariant form of the Seiberg–Witten curve, and the
  relevant coupling paired with $u$ has dimension $2 - \Delta_u$. Because $\Delta_u$ is
  fractional, the $U(1)_r$ symmetry of the fixed point is not a symmetry of the classical
  Lagrangian.

  Together with $D_4$ ($SU(2)$ with four flavors) and $E_6$, $E_7$, $E_8$ (the
  Minahan–Nemeschansky theories), they are the theories on a single D3-brane probing an
  F-theory singularity with constant dilaton. Their flavor symmetry is trivial, $SU(2)$ and
  $SU(3)$, and the Higgs branches of $H_1$ and $H_2$ are the one-instanton moduli spaces of the
  flavor group. Shapere and Tachikawa [@shapere2008] computed $a$ and $c$ from the Seiberg–Witten geometry
  through the topological twist, and Aharony and Tachikawa [@aharony2007] obtained the same values, for any
  rank, from holography. At rank one their formulas reduce to
  $a = \tfrac34\Delta_u - \tfrac{13}{24}$, $c = \Delta_u - \tfrac56$ and $k = 2\Delta_u$.

  The rank-one theories are the first members of larger families labelled by the BPS quiver
  $(A_1, G)$: $H_0 = (A_1, A_2)$, $H_1 = (A_1, A_3) = (A_1, D_3)$, $H_2 = (A_1, D_4)$. The
  $(A_1, A_{N-1})$ theory arises at the maximal Argyres–Douglas point of pure $SU(N)$, with
  closed-form $a$ and $c$ [@shapere2008], and $(A_1, D_N)$ at the maximal conformal point
  of $SU(N-1)$ with two flavors. The flavor symmetry of $(A_1, D_N)$ is $SU(2)$ for odd $N$ and
  $SU(2)\times U(1)$ for even $N$, enhanced to $SU(3)$ at $N = 4$ [@maruyoshi2016].
  From a conjectured relation between the Schur index and the BPS spectrum, Córdova and Shao [@cordova2015]
  found that the Schur index of $(A_1, A_{2n})$ is the vacuum character of the $(2, 2n+3)$
  Virasoro minimal model, that of $(A_1, D_{2n+1})$ is the vacuum character of
  $\widehat{\mathfrak{su}}(2)$ at level $-\tfrac{4n}{2n+1}$, and that of $(A_1, D_4)$ is the
  vacuum character of $\widehat{\mathfrak{su}}(3)$ at level $-\tfrac32$.

  Maruyoshi and Song [@maruyoshi2016] found $\mathcal{N}=1$ gauge theories that flow to these SCFTs with
  supersymmetry enhanced to $\mathcal{N}=2$. One couples an adjoint chiral multiplet $M$ of the
  flavor symmetry of an $\mathcal{N}=2$ SCFT through $W = \mathrm{Tr}\,M\mu$ and gives $M$ a
  principal nilpotent expectation value. $SU(2)$ with four flavors then flows to $H_0$, $SU(N)$
  with $2N$ flavors to $(A_1, A_{2N-1})$, $Sp(N)$ with $2N+2$ flavors to $(A_1, A_{2N})$, and
  the deformed $H_1$ and $H_2$ flow to $H_0$, in each case up to decoupled free chiral
  multiplets. These Lagrangians give the full superconformal index.

  The numerical bootstrap of the four-point function of $u$, with $\Delta_u$ and $c$ fixed to
  the values below, gives narrow two-sided bounds on the OPE coefficient of $u^2$
  [@gimenezgrau2020].

family:
  parameter: G
  members:
    - at: 'H_0'
      label: '$(A_1, A_2)$'
      note: 'No flavor symmetry; $\Delta_u = \tfrac65$, $a = \tfrac{43}{120}$, $c = \tfrac{11}{30}$. The original $SU(3)$ Argyres–Douglas point, and the $N_f = 1$ point of $SU(2)$.'
    - at: 'H_1'
      label: '$(A_1, A_3) = (A_1, D_3)$'
      note: '$SU(2)$ flavor symmetry, $k = \tfrac83$; $\Delta_u = \tfrac43$, $a = \tfrac{11}{24}$, $c = \tfrac12$. The $N_f = 2$ point of $SU(2)$.'
    - at: 'H_2'
      label: '$(A_1, D_4)$'
      note: '$SU(3)$ flavor symmetry, $k = 3$; $\Delta_u = \tfrac32$, $a = \tfrac{7}{12}$, $c = \tfrac23$. The $N_f = 3$ point of $SU(2)$.'

symmetry:
  spacetime: '4d $\mathcal{N}=2$ superconformal group (8 $Q$ + 8 $S$ supercharges); parity not recorded'
  euclidean: '$SO(5,1)$ (bosonic conformal part)'
  lorentzian: '$SU(2,2|2)$'
  supercharges: 8
  global: 'Flavor symmetry: none ($H_0$), $SU(2)$ ($H_1$), $SU(3)$ ($H_2$); R-symmetry $SU(2)_R\times U(1)_r$'
  parity: false
  global_group:
    - {id: SU(2)_R, group: SU(2), tex: 'SU(2)_R'}
    - {id: U(1)_r, group: U(1), tex: 'U(1)_r', note: 'Normalized as in Dolan–Osborn: a Coulomb-branch chiral primary, in an $\mathcal{E}_{r(0,0)}$ multiplet, has $r = \Delta$.'}
    - {id: G_F, group: 'Lie(G_F)', note: 'Flavor symmetry: trivial for $H_0$, $SU(2)$ for $H_1$, $SU(3)$ for $H_2$.'}
  notes: 'Flavor central charges in the normalization where $SU(2)$ with four flavors has $k_{SO(8)} = 4$. Multiplet names follow Dolan and Osborn [@dolan2002] as tabulated by Beem et al. [@beem2013, Table 7]: $\mathcal{E}_{r(0,0)}$ Coulomb-branch chiral, $\hat{\mathcal{B}}_R$ Higgs-branch half-BPS, $\hat{\mathcal{C}}_{0(0,0)}$ stress tensor, $\mathcal{A}^{\Delta}_{R,r(j,\bar\jmath)}$ long. The label of Cordova, Dumitrescu and Intriligator [@cdi2016] is shown on hover; its $u(1)_r$ charge is twice the one here.'

quantities:
  - symbol: 'a'
    description: 'Euler conformal anomaly of $H_0$, $H_1$, $H_2$ (a free real scalar has $a = \tfrac{1}{360}$)'
    value: '\tfrac{43}{120},\ \tfrac{11}{24},\ \tfrac{7}{12}'
    method: exact, Seiberg–Witten geometry; holography
    refs: [shapere2008, aharony2007, beem2014]
    note: '[@aharony2007, Table 2; @beem2014, Table 1]. $H_0$ is also given in [@shapere2008, Eq. (4.32)].'
  - symbol: 'c'
    description: 'Weyl conformal anomaly of $H_0$, $H_1$, $H_2$ (a free real scalar has $c = \tfrac{1}{120}$)'
    value: '\tfrac{11}{30},\ \tfrac{1}{2},\ \tfrac{2}{3}'
    method: exact, Seiberg–Witten geometry; holography
    refs: [shapere2008, aharony2007, beem2014]
    note: 'Same sources as $a$.'
  - symbol: 'k'
    description: 'Flavor central charge of $H_1$ ($SU(2)$) and $H_2$ ($SU(3)$)'
    value: '\tfrac{8}{3},\ 3'
    method: exact, holography; saturates a chiral-algebra unitarity bound
    refs: [aharony2007, beem2013, beem2014]
    note: 'The chiral algebra is conjectured to be the affine flavor algebra at level $k_{2d} = -k/2$ [@beem2014].'
  - symbol: '\lambda^2_{u^2}'
    description: 'Squared OPE coefficient of $u^2$ in $u\times u$ (unit-normalized two-point functions) for $H_1$ and $H_2$'
    value: '[2.216735,\ 2.35462],\ [2.299679,\ 2.69898]'
    method: CB, rigorous bounds
    refs: [gimenezgrau2020]
    note: 'Lower and upper bounds at derivative order $\Lambda = 50$ [@gimenezgrau2020, Table 7], with $\Delta_u$ and $c$ fixed to the values above. For $H_0$ see the minimal Argyres–Douglas entry.'
    category: ope

operators:
  - name: 'u\ (H_0)'
    Delta: '\frac{6}{5}'
    spin: 0
    global: {SU(2)_R: singlet, U(1)_r: 6/5, G_F: singlet}
    role: Coulomb-branch generator
    multiplet: {name: '$u$', component: primary, type: '$\mathcal{E}_{\frac65(0,0)}$', cdi: '$L\bar B_1[0;0]^{(0;\frac{12}{5})}_{\frac65}$'}
    method: exact
    refs: [argyres1995b, aharony2007]
  - name: 'u\ (H_1)'
    Delta: '\frac{4}{3}'
    spin: 0
    global: {SU(2)_R: singlet, U(1)_r: 4/3, G_F: singlet}
    role: Coulomb-branch generator
    multiplet: {name: '$u$', component: primary, type: '$\mathcal{E}_{\frac43(0,0)}$', cdi: '$L\bar B_1[0;0]^{(0;\frac83)}_{\frac43}$'}
    method: exact
    refs: [argyres1995b, aharony2007]
  - name: 'u\ (H_2)'
    Delta: '\frac{3}{2}'
    spin: 0
    global: {SU(2)_R: singlet, U(1)_r: 3/2, G_F: singlet}
    role: Coulomb-branch generator
    multiplet: {name: '$u$', component: primary, type: '$\mathcal{E}_{\frac32(0,0)}$', cdi: '$L\bar B_1[0;0]^{(0;3)}_{\frac32}$'}
    method: exact
    refs: [argyres1995b, aharony2007]

