id: lee-yang-2d
name: '2d Lee–Yang edge singularity CFT'
aliases:
  - '$\mathcal{M}(2,5)$'
  - 'Yang–Lee minimal model'
  - '2d Yang–Lee edge singularity'
  - 'Lee–Yang model'
d: 2
summary: >-
  The non-unitary minimal model $\mathcal{M}(2,5)$, with $c = -\tfrac{22}{5}$ and one non-trivial
  primary $\phi$ of weight $-\tfrac15$. It describes the Lee–Yang edge singularity of the 2d Ising
  model in an imaginary magnetic field, with edge exponent $\sigma = -\tfrac16$.
tags: [CFT, interacting, non-unitary, rational, exactly solvable, minimal model, integrable, critical phenomena]

description: |
  Above the critical temperature, the zeros of the Ising partition function in the complex magnetic
  field $h$ lie on the imaginary axis [@lee1952] and become dense beyond an edge $h_c$, near
  which their density behaves as $(h - h_c)^\sigma$. Fisher [@fisher1978] recognized the edge as a critical point
  and described it by a scalar field theory with an imaginary cubic coupling. Cardy [@cardy1985] showed that in
  two dimensions the critical theory is the simplest non-unitary minimal model, $\mathcal{M}(2,5)$
  with $c = -\tfrac{22}{5}$, and obtained $\sigma = -\tfrac16$: the first application of conformal
  field theory to a non-unitary critical point.

  The Kac table has one non-trivial primary, $\phi = \phi_{1,2} \equiv \phi_{1,3}$, with
  $h = \bar h = -\tfrac15$, so $\Delta_\phi = -\tfrac25$ and $\sigma = \Delta_\phi/(2 - \Delta_\phi)$.
  The fusion rule is $\phi \times \phi = 1 + \phi$; with $\langle\phi(x)\phi(0)\rangle = |x|^{4/5}$
  the three-point coefficient is purely imaginary, as expected from the imaginary cubic coupling.
  The only modular invariant built from the two characters is the diagonal one,
  $Z = |\chi_{1,1}|^2 + |\chi_{1,2}|^2$, and the characters are the Rogers–Ramanujan products
  $$\chi_{1,1} = q^{11/60}\prod_{n\ge0}\frac{1}{(1-q^{5n+2})(1-q^{5n+3})}, \qquad
  \chi_{1,2} = q^{-1/60}\prod_{n\ge0}\frac{1}{(1-q^{5n+1})(1-q^{5n+4})} ,$$
  equal by the Rogers–Ramanujan identities to $q^{11/60}\sum_{n\ge0} q^{n^2+n}/(q)_n$ and
  $q^{-1/60}\sum_{n\ge0} q^{n^2}/(q)_n$, with $(q)_n = \prod_{k=1}^{n}(1-q^k)$. Since $h_\phi < 0$,
  the lowest state on a circle is $\phi$, not the vacuum, and finite-size scaling (for instance the
  free energy of a long periodic strip) is governed by $c_{\rm eff} = c - 24h_\phi = \tfrac25$
  instead of $c$ ([@isz1986], with transfer matrices of the Ising model at the edge).

  ### Related problems
  The same universality class describes the singularity of lattice gases with purely repulsive
  interactions at negative activity; its pressure exponent $\sigma + 1 = \tfrac56$ in two dimensions
  agrees with Baxter's solution of the hard-hexagon model [@baxter1980] (see [@cardy2023]). Parisi and Sourlas [@parisi1981]
  related the Yang–Lee edge in $d$ dimensions to branched polymers in $d + 2$ dimensions, so this
  theory is expected to describe branched polymers in four dimensions. Perturbing the CFT by $\phi$
  gives an integrable massive field theory with a single particle, whose factorized S-matrix was
  found by Cardy and Mussardo [@cardymussardo1989]. Imaginary magnetic deformations of the tricritical Ising model reach
  this fixed point and, it is argued, its tricritical version $\mathcal{M}(2,7)$ [@lencses2023].

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = -\tfrac{22}{5}$ — 2d conformal symmetry, with parity; Euclidean only (non-unitary statistical model)'
  supercharges: 0
  global: 'No invertible internal symmetry: since $C_{\phi\phi\phi} \neq 0$, no phase rotation of $\phi$ is allowed (the Ising $\mathbb{Z}_2$ is broken by the imaginary field).'
  notes: 'Not unitary. The spectrum is real because the quantum Hamiltonian is invariant under complex conjugation, $H \to H^*$, combined with $\phi \to -\phi$ [@cardy2023].'

quantities:
  - key: c
    symbol: 'c'
    description: 'Virasoro central charge ($c_L = c_R$)'
    value: '-22/5'
    method: exact
    refs: [isz1986, arguellocruz2025]
  - symbol: 'c_{\rm eff}'
    description: 'Effective central charge, $c - 24h_{\min}$ with $h_{\min} = h_\phi$'
    value: '\frac{2}{5}'
    method: exact
    refs: [isz1986]
    note: 'Replaces $c$ in the finite-size free energy of a long periodic strip. Transfer-matrix estimates for the Ising model at the edge converge to $\tfrac25$ rather than to $c$ [@isz1986, Table I].'
  - symbol: '\sigma'
    description: 'Yang–Lee edge exponent, $\sigma = \Delta_\phi/(2 - \Delta_\phi)$'
    value: '-\frac{1}{6}'
    method: exact
    refs: [cardy1985, arguellocruz2025]
  - symbol: '\nu'
    description: 'Correlation-length exponent at the edge, $\xi \sim |H - H_c|^{-\nu}$ with $\nu = 1/(2 - \Delta_\phi)$'
    value: '\frac{5}{12}'
    method: exact
    refs: [isz1986]

three_point_functions:
  - operators: ['\phi = \phi_{1,2}', '\phi = \phi_{1,2}', '\phi = \phi_{1,2}']
    values:
      - structure: scalar
        symbol: 'C_{\phi\phi\phi}'
        value: 'i\left(\frac{\Gamma(6/5)^2\,\Gamma(1/5)\,\Gamma(2/5)}{\Gamma(3/5)\,\Gamma(4/5)^3}\right)^{1/2}'
        method: exact
        refs: [arguellocruz2025, cardy2023]
        note: '$\approx 1.911312699\,i$ [@arguellocruz2025, Eq. (2.2)], defined by $\phi(x)\times\phi(0) = |x|^{4/5}\,1 + C_{\phi\phi\phi}\,|x|^{2/5}\,\phi$. Purely imaginary; its sign flips under $\phi \to -\phi$.'

operators:
  - name: '\phi = \phi_{1,2}'
    Delta: '-\frac{2}{5}'
    spin: 0
    weights: '(-\tfrac{1}{5}, -\tfrac{1}{5})'
    rep: the only non-trivial primary
    method: exact
    refs: [cardy1985, arguellocruz2025]
    note: 'Also labelled $\phi_{1,3}$. Lies below the vacuum, so it dominates the torus partition function at low temperature.'

relations:
  - type: member_of
    target: virasoro-minimal-nonunitary
    at: '(2,5)'
  - type: related_to
    target: lee-yang-3d
    note: 'The Lee–Yang edge singularity in $d = 2$ and $d = 3$: one universality class (the $i\phi^3$ theory, upper critical dimension 6) continued in dimension.'
  - type: related_to
    target: ising-2d
    note: 'The Ising CFT perturbed by the energy operator and a purely imaginary magnetic field flows to the Lee–Yang fixed point [@lencses2023].'

