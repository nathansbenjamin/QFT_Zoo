id: ising-star-3d
name: '3d Ising$^*$ CFT'
aliases:
  - 'Ising*'
  - 'Critical point of the 3d $\mathbb{Z}_2$ lattice gauge theory'
  - 'Gauged 3d Ising CFT'
  - 'Confinement transition of a $\mathbb{Z}_2$ topological phase'
d: 3
summary: >-
  The 3d Ising CFT with its $\mathbb{Z}_2$ gauged: the critical point of the 3d
  $\mathbb{Z}_2$ lattice gauge theory. Its local operators are the $\mathbb{Z}_2$-even Ising
  operators, and it has a $\mathbb{Z}_2$ 1-form symmetry.
tags: [CFT, interacting, unitary, gauge theory, orbifold, critical phenomena]

description: |
  Wegner [@wegner1971] showed that the 3d Ising model is dual to a $\mathbb{Z}_2$ lattice gauge theory
  (an Ising model on the simple cubic lattice whose Hamiltonian contains products of four
  spins), which therefore has a phase transition without a local order parameter. In $2+1$
  dimensions the same transition separates a $\mathbb{Z}_2$ topological phase from a
  trivial phase, for example in the toric code in a field, where it is driven by the
  condensation of one type of anyon. That anyon field $\phi$ can only be created in
  pairs, and $\phi$ and $-\phi$ are indistinguishable, so the critical theory is the Ising
  CFT restricted to $\mathbb{Z}_2$-even states, with both periodic and antiperiodic
  boundary conditions on a torus [@schuler2016].

  In modern language, Ising$^*$ is the Ising CFT with its $\mathbb{Z}_2$ 0-form symmetry
  gauged. On $\mathbb{R}^3$, or any simply connected space, this does not change the
  correlators of $\mathbb{Z}_2$-even local operators, so their dimensions, OPE coefficients
  and $C_T$ are those of the 3d Ising CFT; the values below are the Ising values. The
  thermal exponent $\nu$ is unchanged. The spin field $\sigma$ is no longer a local
  operator: it can only appear at the end of a $\mathbb{Z}_2$ Wilson line. As for any
  gauging of a discrete symmetry, the theory acquires a dual $\mathbb{Z}_2$ symmetry, here
  a 1-form symmetry, generated by the Wilson lines. The objects charged under it are the
  former $\mathbb{Z}_2$ twist lines of the Ising CFT, which become genuine line operators.
  Gauging the 1-form symmetry gives back the Ising CFT [@gaiotto2015].

  The two theories differ on spaces with non-contractible cycles. On a spatial torus the
  Ising$^*$ spectrum contains the $\mathbb{Z}_2$-even Ising levels with periodic
  boundary conditions, together with the sectors with antiperiodic boundary conditions. It
  has four very low-lying levels, the remnant of the four-fold degenerate ground state of the
  topological phase; at criticality they scale as $1/L$, like the rest of the spectrum,
  instead of becoming exponentially degenerate. Exact diagonalization of the toric code in a field and the $\epsilon$-expansion
  agree on this spectrum [@schuler2016].

  Gauging a $\mathbb{Z}_2$ subgroup of other symmetries gives analogous starred
  theories. In XY$^*$, the transition at which fractionalized bosons condense out of a
  phase with an emergent $\mathbb{Z}_2$ gauge field, the physical order parameter is a composite of two
  fractionalized fields, and quantum Monte Carlo finds a large anomalous dimension,
  $\eta = 1.49(2)$ [@isakov2012]. $O(N)^*$ is defined in the same way.

symmetry:
  spacetime: '3d conformal group with parity'
  euclidean: '$O(4,1)$'
  lorentzian: '$O(3,2)$'
  supercharges: 0
  global: '$\mathbb{Z}_2$ 1-form symmetry, generated by the $\mathbb{Z}_2$ Wilson lines'
  gauge: '$\mathbb{Z}_2$'
  notes: 'Gauging the $\mathbb{Z}_2$ 1-form symmetry returns the 3d Ising CFT. The Ising order parameter $\sigma$ is not gauge invariant, so there is no local order parameter.'

quantities:
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient, relative to one free real scalar'
    value: '0.946538675(42)'
    method: CB
    refs: [chang2024]
    note: 'Identical to the 3d Ising value, since $T_{\mu\nu}$ is gauge invariant.'
  - symbol: '\nu'
    description: 'Correlation-length exponent, $\nu = 1/(3-\Delta_\epsilon)$'
    value: '0.62997097(12)'
    method: CB, from Δε
    refs: ['chang2024, Table 2']
    note: 'From $\Delta_\epsilon$ [@chang2024, Table 2]; identical to the 3d Ising value.'

three_point_functions:
  - operators: ['\epsilon', '\epsilon', '\epsilon']
    values:
      - structure: scalar
        symbol: '\lambda_{\epsilon\epsilon\epsilon}'
        value: '1.53244304(58)'
        method: CB
        refs: [chang2024]
        note: Identical to the 3d Ising value.

operators:
  - name: '\epsilon'
    Delta: '1.41262528(29)'
    spin: 0
    rep: 'gauge invariant ($\mathbb{Z}_2$-even in Ising)'
    method: CB
    refs: [chang2024]
    note: 'The only relevant local scalar (the tuning parameter), since $\sigma$ is not gauge invariant.'
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    rep: gauge invariant
    method: exact
    note: Stress tensor (conserved).
  - name: "\\epsilon'"
    Delta: '3.82968(23)'
    spin: 0
    rep: gauge invariant
    method: CB
    refs: [simmonsduffin2016]
    note: 'Leading irrelevant scalar, $\omega = \Delta_{\epsilon''} - 3$.'
  - name: 'C_{\mu\nu\rho\sigma}'
    Delta: '5.022665(28)'
    spin: 4
    rep: gauge invariant
    method: CB
    refs: [simmonsduffin2016]
    note: Lightest spin-4 operator.

relations:
  - type: orbifold_of
    target: ising-3d
    note: 'Gauging the $\mathbb{Z}_2$ 0-form symmetry of the Ising CFT. Gauging the resulting $\mathbb{Z}_2$ 1-form symmetry gives the Ising CFT back. On $\mathbb{R}^3$ the two share all correlators of $\mathbb{Z}_2$-even local operators.'

